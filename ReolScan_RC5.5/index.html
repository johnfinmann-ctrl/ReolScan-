    <div class="btn-row"><button class="btn btn-green btn-lg" onclick="fhSaveMeasure('${key}')">Gem måling</button><button class="btn btn-ghost" onclick="fhCloseMeasure()">Annullér</button></div>
    ${saved.length?`<div class="fh-sec" style="margin-top:12px"><b>Gemte målinger (${saved.length})</b>${saved.map(x=>`<div class="fh-ms"><span>${esc(x.reolId||'–')} · ${x.valueMm} mm${x.direction?' · '+esc(x.direction):''}${x.limitMm!=null?' · grænse '+x.limitMm+' mm (s. '+x.limitPage+')':''}${x.comment?' · '+esc(x.comment):''}</span><button class="fh-i" onclick="fhDelMeasure('${x.id}')" aria-label="Slet måling">✕</button></div>`).join('')}</div>`:''}
  </div>`;
  document.body.appendChild(o); fhMeasureInfo();
}
function fhMeasureLimit(key){
  const m=FAGLIG.measure[key]; const con=(document.getElementById('fm_con')||{}).value;
  const lenOk = !m.needLen || (document.getElementById('fm_len')||{}).checked;
  const c=m.cons.find(x=>x.k===con);
  return (c && lenOk) ? {limit:c.limit, page:m.pages[0], label:c.label} : null;
}
function fhMeasureInfo(){
  const o=document.getElementById('fhMeasureOverlay'); if(!o) return; const key=o.dataset.key;
  const L=fhMeasureLimit(key); const v=parseFloat((document.getElementById('fm_val')||{}).value);
  let t;
  if(!L) t='Ingen vejledende grænse vises: vælg den konstruktion og målesituation, der svarer til brochurens tegning'+(FAGLIG.measure[key].needLen?' (og bekræft målelængden)':'')+'. Gælder brochurens situation ikke, vurderer inspektøren selv.';
  else{
    t=`Vejledende grænse fra brochuren (s. ${L.page}): maks. ${L.limit} mm.`;
    if(!isNaN(v)) t+= v>L.limit ? ` Målt ${v} mm er over den vejledende grænse — vurder om en afvigelse skal registreres.` : ` Målt ${v} mm er ikke over den vejledende grænse. Det er ikke i sig selv en godkendelse — vurderingen foretages af inspektøren.`;
  }
  document.getElementById('fm_info').textContent=t;
}
async function fhSaveMeasure(key){
  const insp=getInspection(state.currentInspectionId); if(!insp) return;
  const v=parseFloat(document.getElementById('fm_val').value);
  if(isNaN(v)||v<0){ toast('Indtast målt værdi i mm'); return; }
  const L=fhMeasureLimit(key), f=document.getElementById('fm_photo').files[0];
  let photo=null; if(f){ try{ photo=await fhReadPhoto(f); }catch(e){ toast('Foto kunne ikke læses'); } }
  insp.measurements=insp.measurements||[];
  insp.measurements.push({ id:uid('ms'), ctrlKey:key, reolId:document.getElementById('fm_reol').value, valueMm:v,
    direction:document.getElementById('fm_dir').value, comment:document.getElementById('fm_note').value.trim(), photo,
    construction:L?L.label:null, limitMm:L?L.limit:null, limitPage:L?L.page:null, ts:new Date().toISOString() });
  saveDB(DB); fhCloseMeasure(); fhRefreshPanel(insp); toast('Måling gemt');
}
function fhDelMeasure(id){
  const insp=getInspection(state.currentInspectionId); if(!insp) return;
  const key=(document.getElementById('fhMeasureOverlay')||{dataset:{}}).dataset.key;
  insp.measurements=(insp.measurements||[]).filter(x=>x.id!==id); saveDB(DB); fhRefreshPanel(insp);
  if(key) fhMeasure(key);
}

/* ---------- Genbrug seneste eftersyn (valgfrit) ---------- */
function fhPrevInspection(customerId){
  const list=DB.inspections.filter(i=>i.customerId===customerId && (i.reoler||[]).length)
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));

<script id="photoMailScript">
/* =========================================================
   RC5.5 — FOTOS (lightbox, flere fotos, billedtekst, udskift/slet) + BILLEDER I PDF + SEND RAPPORT
   Intet markeres som "sendt" uden inspektørens egen bekræftelse.
========================================================= */
const PH = p=>/^data:image\/svg/.test(p||'');
function phScrollKeep(fn){ const y=window.scrollY; fn(); try{ window.scrollTo(0,y); }catch(e){} }

/* ---------- generisk bekræftelse (aldrig sletning uden advarsel) ---------- */
function fhConfirm(msg, okLabel, fn){
  const o=document.createElement('div'); o.className='modal-overlay'; o.id='fhConfirmOv'; o.style.zIndex=400;
  o.innerHTML=`<div class="modal" style="max-width:380px"><h2>Bekræft</h2><p style="font-size:15px;line-height:1.45">${esc(msg)}</p>
    <div class="btn-row"><button class="btn btn-danger btn-lg" id="fhConfirmOk">${esc(okLabel)}</button><button class="btn btn-ghost btn-lg" id="fhConfirmNo">Annullér</button></div></div>`;
  document.body.appendChild(o);
  document.getElementById('fhConfirmNo').onclick=()=>o.remove();
  document.getElementById('fhConfirmOk').onclick=()=>{ o.remove(); fn(); };
}

/* ---------- foto-adgang: arbejdsform eller gemt skade (gruppe) ---------- */
function phGet(ctx){
  if(ctx.kind==='work'){
    const f=state.workForm; if(!f) return null;
    f.photoCaptions=f.photoCaptions||[]; while(f.photoCaptions.length<f.photos.length) f.photoCaptions.push('');
    return { editable:true, photos:f.photos, caps:f.photoCaptions,
      info:{ reol:f.reolId||f.manualLocation||'', types:SKADE_TYPES.filter(t=>f.types[t.key]).map(t=>t.label).join(', '), date:null },
      save(p,c){ f.photos=p; f.photoCaptions=c; } };
  }
  const insp=getInspection(state.currentInspectionId); if(!insp) return null;
  const rows=insp.skader.filter(s=>(s.groupId||s.id)===ctx.gid); if(!rows.length) return null;
  const r0=rows[0]; const caps=(r0.photoCaptions||[]).slice(); while(caps.length<(r0.photos||[]).length) caps.push('');
  return { editable: insp.status==='open', photos:(r0.photos||[]).slice(), caps,
    info:{ reol:r0.reolId, types:rows.map(r=>r.defectType).join(', '), date:r0.date, cust:insp.customerName, rep:insp.reportNumber||'' },
    save(p,c){ rows.forEach(r=>{ r.photos=p.slice(); r.photoCaptions=c.slice(); }); if(!saveDB(DB)) toast('⚠️ Foto-ændring er IKKE gemt — lageret er fuldt. Tag backup.'); } };
}
function phItems(g){ return g.photos.map((p,i)=>({p,i,cap:g.caps[i]||''})).filter(x=>!PH(x.p)); }

/* ---------- lightbox ---------- */
const PHV = { ctx:null, pos:0, changed:false, confirm:false, zoom:false };
function fhPhotoOpen(ctx,pos){ PHV.ctx=ctx; PHV.pos=pos||0; PHV.changed=false; PHV.confirm=false; PHV.zoom=false; phRender(); }
function phRender(){
  let o=document.getElementById('phOv');
  const g=phGet(PHV.ctx); if(!g){ phClose(); return; }
  const items=phItems(g);
  if(!items.length){ phClose(); return; }
  PHV.pos=Math.max(0,Math.min(items.length-1,PHV.pos)); const it=items[PHV.pos];
  if(!o){ o=document.createElement('div'); o.id='phOv'; o.className='ph-ov'; o.setAttribute('role','dialog'); o.setAttribute('aria-label','Foto'); document.body.appendChild(o); }
  const meta=[g.info.cust, g.info.rep, g.info.reol?'Reol '+g.info.reol:'', g.info.types, g.info.date?fmtDate(g.info.date):''].filter(Boolean).join(' · ');
  o.innerHTML=`
    <div class="ph-bar"><button class="ph-back" onclick="phClose()">← Tilbage</button><span class="ph-count">Foto ${PHV.pos+1} af ${items.length}</span>
      <button class="ph-b" onclick="phZoom()" aria-label="Forstør">🔍 ${PHV.zoom?'Tilpas':'Forstør'}</button></div>
    <div class="ph-stage ${PHV.zoom?'zoom':''}"><img src="${it.p}" alt="Foto ${PHV.pos+1}"></div>
    <div class="ph-foot">
      <div class="ph-meta">${esc(meta)}</div>
      ${g.editable?`<input id="phCap" class="ph-cap" maxlength="140" placeholder="Billedtekst (kort)" value="${esc(it.cap)}" oninput="PHV.capTmp=this.value" onchange="phSetCap(this.value)" onblur="phSetCap(this.value)">`
                   :`<div class="ph-capro">${it.cap?esc(it.cap):'<i>Ingen billedtekst</i>'}</div>`}
      <div class="ph-nav">
        <button class="ph-b" onclick="phStepTo(-1)" ${PHV.pos===0?'disabled':''} aria-label="Forrige">‹</button>
        ${g.editable?(PHV.confirm
          ?`<span class="ph-ask">Slet dette foto? Det kan ikke fortrydes.</span><button class="btn btn-danger" onclick="phDelete()">Ja, slet foto</button><button class="btn btn-ghost" onclick="PHV.confirm=false;phRender()">Annullér</button>`
          :`<label class="btn btn-ghost ph-rep">🔄 Udskift<input type="file" accept="image/*" style="display:none" onchange="phReplace(event)"></label><button class="btn btn-danger" onclick="PHV.confirm=true;phRender()">🗑 Slet</button>`):'<span class="ph-ask">Rapporten er afsluttet — fotos kan ikke ændres.</span>'}
        <button class="ph-b" onclick="phStepTo(1)" ${PHV.pos>=items.length-1?'disabled':''} aria-label="Næste">›</button>
      </div>
    </div>`;
}
function phZoom(){ PHV.zoom=!PHV.zoom; phRender(); }
function phStepTo(d){ phSetCap((document.getElementById('phCap')||{}).value); PHV.pos+=d; PHV.confirm=false; phRender(); }
function phSetCap(v){
  if(v===undefined) return; const g=phGet(PHV.ctx); if(!g||!g.editable) return;
  const items=phItems(g); const it=items[PHV.pos]; if(!it||(g.caps[it.i]||'')===v) return;
  g.caps[it.i]=v; g.save(g.photos.slice(),g.caps.slice()); PHV.changed=true;
}
function phDelete(){
  const g=phGet(PHV.ctx); if(!g||!g.editable) return; const it=phItems(g)[PHV.pos]; if(!it) return;
  const p=g.photos.slice(), c=g.caps.slice(); p.splice(it.i,1); c.splice(it.i,1); g.save(p,c);
  PHV.changed=true; PHV.confirm=false; toast('Foto slettet'); phRender();
}
async function phReplace(e){
  const f=e.target.files[0]; if(!f) return; const g=phGet(PHV.ctx); if(!g||!g.editable) return;
  const it=phItems(g)[PHV.pos]; const data=await compressImage(f,1400,0.72);
  if(!data){ toast('Billedet kunne ikke læses — det gamle foto er bevaret'); return; }
  const p=g.photos.slice(); p[it.i]=data; g.save(p,g.caps.slice()); PHV.changed=true; phRender(); toast('Foto udskiftet');
}
function phClose(){
  const g=PHV.ctx&&phGet(PHV.ctx); if(g&&g.editable){ const v=(document.getElementById('phCap')||{}).value; phSetCap(v); }
  const o=document.getElementById('phOv'); if(o) o.remove();
  if(PHV.changed){ PHV.changed=false; phScrollKeep(()=>render()); }
}
window.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !document.getElementById('fhViewer') && document.getElementById('phOv')){ phClose(); e.stopImmediatePropagation(); }
  else if(document.getElementById('phOv') && !document.getElementById('fhViewer') && (e.key==='ArrowRight'||e.key==='ArrowLeft') && document.activeElement.id!=='phCap'){ phStepTo(e.key==='ArrowRight'?1:-1); }
}, true);

/* tilføj fotos til en gemt skade (kamera eller enhed) */
async function phAddToSkade(gid, e){
  const insp=getInspection(state.currentInspectionId); if(!insp||insp.status!=='open') return;
  const files=Array.from(e.target.files||[]); if(!files.length) return;
  const rows=insp.skader.filter(s=>(s.groupId||s.id)===gid); if(!rows.length) return;
  let photos=(rows[0].photos||[]).slice(), caps=(rows[0].photoCaptions||[]).slice();
  const keep=photos.map((p,i)=>PH(p)?-1:i).filter(i=>i>=0); photos=keep.map(i=>photos[i]); caps=keep.map(i=>caps[i]||'');
  let fail=0;
  for(const f of files){ const d=await compressImage(f,1400,0.72); if(d){ photos.push(d); caps.push(''); } else fail++; }
  rows.forEach(r=>{ r.photos=photos.slice(); r.photoCaptions=caps.slice(); });
  if(!saveDB(DB)) toast('⚠️ Fotoet er IKKE gemt — lageret er fuldt. Tag backup.'); else toast(fail?(files.length-fail)+' foto tilføjet, '+fail+' kunne ikke læses':'Foto tilføjet');
  phScrollKeep(()=>render());
}
function phCardPhotos(group, insp){
  const r0=group[0], gid=r0.groupId||r0.id; const caps=r0.photoCaptions||[];
  const items=(r0.photos||[]).map((p,i)=>({p,cap:caps[i]||''})).filter(x=>!PH(x.p));
  const edit=insp.status==='open';
  return `<div class="photo-grid" style="margin-top:8px">${items.map((x,n)=>`<div class="photo-thumb ph-t" onclick="fhPhotoOpen({kind:'skade',gid:'${gid}'},${n})" title="${esc(x.cap)}"><img src="${x.p}" alt="Foto ${n+1}">${x.cap?'<span class="ph-tc">💬</span>':''}</div>`).join('')}
    ${edit?`<label class="ph-add" aria-label="Tag foto">📷＋<input type="file" accept="image/*" capture="environment" style="display:none" onchange="phAddToSkade('${gid}',event)"></label>
    <label class="ph-add" aria-label="Vælg fra enhed">🖼＋<input type="file" accept="image/*" multiple style="display:none" onchange="phAddToSkade('${gid}',event)"></label>`:''}</div>
    ${items.length?`<div class="meta">${items.length} foto${items.length===1?'':'s'} · tryk for at forstørre${edit?', skrive billedtekst, udskifte eller slette':''}</div>`:''}`;
}

/* ---------- billeder i PDF: komprimér store billeder, bevar læsbar kvalitet ---------- */
const PDFIMG = new Map();
function fhRecompress(src, maxDim, q){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{ try{
      const w0=img.naturalWidth||img.width,h0=img.naturalHeight||img.height; const k=Math.min(1,maxDim/Math.max(w0,h0));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w0*k)); c.height=Math.max(1,Math.round(h0*k));
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      res({data:c.toDataURL('image/jpeg',q), w:c.width, h:c.height});
    }catch(e){ res(null); } };
    img.onerror=()=>res(null); img.src=src;
  });
}
async function fhPrepPdfImages(insp){
  let fail=0, total=0;
  for(const s of insp.skader){
    for(const p of [].concat(s.photos||[], s.photosAfter||[])){
      if(!p||PH(p)) continue; total++;
      if(!PDFIMG.has(p)){ const r=await fhRecompress(p,1000,0.72); PDFIMG.set(p, r||{fail:true}); }
      if(PDFIMG.get(p).fail) fail++;
    }
  }
  return {total, fail};
}

/* ---------- generatePDF: forbereder billeder, bygger PDF, gemmer ---------- */
async function generatePDF(inspId, opts){
  const insp=getInspection(inspId); if(!insp){ toast('Eftersyn ikke fundet'); return null; }
  const st=await fhPrepPdfImages(insp);
  const r=generatePDFSync(inspId, Object.assign({}, opts||{}, {imgStats:st}));
  if(r && r.blob){ r.photos=st.total; r.fail=st.fail; }
  if(st.fail) toast('⚠️ '+st.fail+' foto kunne ikke indlæses i rapporten — se markering i PDF\'en');
  return r||null;
}

const SEND = { insp:null, report:null, building:null };
function fhFmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' MB' : Math.round(n/1024)+' kB'; }
function fhEmailsOk(s){ const a=String(s||'').split(/[;,\s]+/).filter(Boolean); return a.length>0 && a.every(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)); }
function fhDefaultBody(insp, c){
  const nm=insp.inspector||getInspectorName();
  return `Kære ${insp.contact||c.contact||'kunde'},\n\nHermed rapport ${insp.reportNumber} for reoleftersyn udført ${fmtDate(insp.date)}.\nRapporten er udarbejdet af sagkyndig inspektør ${nm}.\n\nHar du spørgsmål til rapporten, er du velkommen til at kontakte os.\n\nMed venlig hilsen\n${nm}\nReoler A/S`;
}
function fhMailEntry(inspId){ return (DB.mailLog||[]).find(m=>m.inspectionId===inspId); }
function fhMailBadge(inspId){
  const m=fhMailEntry(inspId); const st=m?m.status:'';
  if(/^sendt/.test(st)) return `<span class="pill green">✔ Sendt — bekræftet af inspektør${m.confirmedAt?' '+esc(m.confirmedAt):''}</span>`;
  if(st && st!=='klargjort') return `<span class="pill yellow">${esc(st)} — IKKE bekræftet sendt</span>`;
  return `<span class="pill grey">Ikke sendt</span>`;
}
function fhMailLog(inspId, status, action, extra){
  const insp=getInspection(inspId); const c=DB.customers.find(x=>x.id===insp.customerId)||{};
  DB.mailLog=DB.mailLog||[]; let m=fhMailEntry(inspId);
  if(!m){ m={id:uid('mail'),customerId:insp.customerId,inspectionId:inspId,to:'',cc:'',subject:'',body:'',date:todayISO(),status:'klargjort',log:[]}; DB.mailLog.push(m); }
  Object.assign(m, extra||{}); m.status=status; m.date=todayISO(); m.log=m.log||[]; m.log.push({ts:new Date().toISOString(), action});
  saveDB(DB);
}
function openSendReport(inspId){

  SEND.insp=inspId; SEND.report=null;

  o.innerHTML=`<div class="modal fh-sheet send-sheet" role="dialog" aria-label="Send rapport til kunde">
    <button class="modal-close" onclick="closeSendReport()" aria-label="Luk">✕</button>
    <h2>📧 Send rapport til kunde</h2>
    <div class="fh-info"><b>Sådan virker det:</b> ReolScan har ingen mailserver og kan derfor ikke sende e-mail selv. Du sender fra din egen e-mail eller enhed. Rapporten markeres <b>kun</b> som sendt, når du selv bekræfter det nederst.</div>
    <div class="formgrid">
      <div class="field full"><label>Til (fra kundekortet — kan rettes)</label><input id="sd_to" type="email" multiple inputmode="email" value="${esc((prev&&prev.to)||mc.email||c.email||insp.email||'')}" oninput="this.classList.remove('bad')"></div>
      <div class="field full"><label>CC (valgfri)</label><input id="sd_cc" value="${esc((prev&&prev.cc)||mc.cc||'')}"></div>
      <div class="field full"><label>Emne</label><input id="sd_sub" value="${esc((prev&&prev.subject)||('Reoleftersyn '+insp.reportNumber+' — '+insp.customerName))}"></div>
      <div class="field full"><label>Tekst</label><textarea id="sd_body" rows="9">${esc((prev&&prev.body&&!/Vedhæftet finder/.test(prev.body))?prev.body:fhDefaultBody(insp,c))}</textarea></div>
    </div>
    <div class="fh-sec"><b>1. Gennemse rapporten</b>
      <div class="fh-ready" id="sd_ready">Forbereder rapporten med fotos…</div>
      <div class="btn-row"><button class="btn btn-primary" id="sd_view" onclick="fhPreviewReport()" disabled>👁 Vis rapporten</button></div></div>
    <div class="fh-sec"><b>2. Send — vælg metode</b>
      <div class="send-opts">
        <button class="btn btn-green btn-lg" id="sd_share" onclick="fhSendShare()" disabled style="display:none">📤 Del PDF til e-mail-app (PDF vedhæftes af enheden)</button>
        <button class="btn btn-ghost btn-lg" id="sd_mailto" onclick="fhSendMailto()" disabled>✉️ Download PDF og åbn e-mailprogram (du vedhæfter selv)</button>
        <button class="btn btn-ghost btn-lg" id="sd_eml" onclick="fhSendEml()" disabled>📎 Hent mailudkast (.eml) med PDF vedhæftet</button>
        <button class="btn btn-ghost" id="sd_dl" onclick="fhSendDownload()" disabled>⬇ Kun download PDF</button>
      </div>

    <div class="fh-sec"><b>3. Bekræft</b><p class="fh-disc" style="margin:2px 0 8px">Tryk først, når du selv har sendt e-mailen med rapporten.</p>
      <div id="sd_status">${fhMailBadge(inspId)}</div>
      <div class="btn-row"><button class="btn btn-ghost" id="sd_confirm" onclick="fhConfirmSent()">✔ Jeg har sendt rapporten</button></div></div>

function closeSendReport(){ const o=document.getElementById('sendOv'); if(o) o.remove(); }
async function fhPrepareReport(inspId){
  const rdy=document.getElementById('sd_ready');
  try{
    const r=await generatePDF(inspId,{asBlob:true}); if(!r) throw new Error('PDF-generering fejlede');
    SEND.report=r;
    if(!document.getElementById('sendOv')) return;
    rdy.innerHTML=`✔ Rapport klar: <b>${esc(r.filename)}</b> · ${fhFmtSize(r.blob.size)}${r.pages?' · '+r.pages+' sider':''} · ${r.photos} foto${r.photos===1?'':'s'} i rapporten${r.fail?` · <b style="color:var(--red)">${r.fail} kunne ikke indlæses</b>`:''}${r.blob.size>20*1048576?'<br><b style="color:var(--red)">Filen er over 20 MB — mange mailsystemer afviser den.</b>':''}`;
    ['sd_view','sd_mailto','sd_eml','sd_dl'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=false; });
    const file=new File([r.blob], r.filename, {type:'application/pdf'});
    const canShare=!!(navigator.canShare && navigator.share && navigator.canShare({files:[file]}));
    const sb=document.getElementById('sd_share'); if(canShare){ sb.style.display=''; sb.disabled=false; }
    document.getElementById('sd_note').textContent = canShare ? 'Anbefalet her: "Del PDF…" — vælg din e-mail-app, så er PDF\'en vedhæftet.' : 'Denne browser kan ikke dele filer direkte. Brug "Download PDF og åbn e-mailprogram" (vedhæft filen selv) eller mailudkastet (.eml, åbnes i fx Outlook).';
  }catch(e){ if(rdy) rdy.innerHTML='<b style="color:var(--red)">Rapporten kunne ikke forberedes ('+esc(e.message||e)+').</b> Intet er sendt.'; }
}
function fhSendFields(){
  const to=val('sd_to').trim(); const el=document.getElementById('sd_to');
  if(!fhEmailsOk(to)){ if(el){el.classList.add('bad'); el.focus();} toast('Ret modtagerens e-mailadresse'); return null; }
  const cc=val('sd_cc').trim(); if(cc && !fhEmailsOk(cc)){ toast('Ret CC-adressen'); return null; }
  return {to:to.replace(/[;\s]+/g,','), cc:cc.replace(/[;\s]+/g,','), subject:val('sd_sub'), body:val('sd_body')};
}
function fhSaveBlob(blob, filename){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function fhOpenMailto(url){ const a=document.createElement('a'); a.href=url; a.style.display='none'; document.body.appendChild(a); a.click(); a.remove(); }
function fhSetStatus(){ const s=document.getElementById('sd_status'); if(s) s.innerHTML=fhMailBadge(SEND.insp); }
async function fhSendShare(){
  const f=fhSendFields(); const r=SEND.report; if(!f||!r) return;
  const file=new File([r.blob], r.filename, {type:'application/pdf'});
  try{
    await navigator.share({files:[file], title:f.subject, text:f.body});
    fhMailLog(SEND.insp,'delt via enhedens delingsmenu','share',{to:f.to,cc:f.cc,subject:f.subject,body:f.body});
    fhSetStatus(); toast('Delingsmenuen blev gennemført — det er IKKE bekræftet, at mailen er sendt');
  }catch(e){ if(e&&e.name!=='AbortError') toast('Deling mislykkedes — prøv en anden metode'); }
}
function fhSendMailto(){
  const f=fhSendFields(); const r=SEND.report; if(!f||!r) return;
  fhSaveBlob(r.blob, r.filename);
  const body=f.body+'\n\n[Husk: vedhæft filen '+r.filename+' før du sender]';
  fhOpenMailto('mailto:'+f.to+'?'+(f.cc?'cc='+encodeURIComponent(f.cc)+'&':'')+'subject='+encodeURIComponent(f.subject)+'&body='+encodeURIComponent(body));
  fhMailLog(SEND.insp,'e-mailprogram åbnet (PDF downloadet, ikke vedhæftet)','mailto',{to:f.to,cc:f.cc,subject:f.subject,body:f.body});
  fhSetStatus(); toast('PDF downloadet og e-mailprogram åbnet — vedhæft '+r.filename+' selv. IKKE markeret som sendt.');
}
async function fhBuildEml(f, r){
  const dataUrl=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(r.blob); });
  const b64=dataUrl.split(',')[1]; const wrap=s=>s.replace(/(.{76})/g,'$1\r\n');
  const enc=s=>'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(s)))+'?=';
  const tb=btoa(unescape(encodeURIComponent(f.body.replace(/\r?\n/g,'\r\n'))));
  const bd='----ReolScan'+Date.now().toString(36);
  return ['X-Unsent: 1','To: '+f.to, f.cc?'Cc: '+f.cc:null,'Subject: '+enc(f.subject),'MIME-Version: 1.0','Content-Type: multipart/mixed; boundary="'+bd+'"','',
    '--'+bd,'Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64','',wrap(tb),
    '--'+bd,'Content-Type: application/pdf; name="'+r.filename+'"','Content-Transfer-Encoding: base64','Content-Disposition: attachment; filename="'+r.filename+'"','',wrap(b64),'--'+bd+'--',''].filter(x=>x!==null).join('\r\n');
}
async function fhSendEml(){
  const f=fhSendFields(); const r=SEND.report; if(!f||!r) return;
  const eml=await fhBuildEml(f,r); window.__lastEml=eml;
  fhSaveBlob(new Blob([eml],{type:'message/rfc822'}), (r.filename||'rapport').replace(/\.pdf$/i,'')+'.eml');
  fhMailLog(SEND.insp,'mailudkast (.eml) hentet','eml',{to:f.to,cc:f.cc,subject:f.subject,body:f.body});
  fhSetStatus(); toast('Mailudkast hentet — åbn filen i dit e-mailprogram og send. IKKE markeret som sendt.');
}
function fhSendDownload(){
  const r=SEND.report; if(!r) return; fhSaveBlob(r.blob, r.filename);
  fhMailLog(SEND.insp,'PDF downloadet','download'); fhSetStatus(); toast('PDF downloadet — ikke sendt');
}
function fhConfirmSent(){
  const f=fhSendFields(); if(!f) return;
  fhConfirm('Bekræfter du, at du selv har sendt rapporten til '+f.to+'?','Ja, jeg har sendt den',()=>{
    const d=new Date(); const ts=fmtDate(todayISO())+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    fhMailLog(SEND.insp,'sendt (bekræftet af inspektør)','bekræftet af inspektør',{to:f.to,cc:f.cc,subject:f.subject,body:f.body,confirmedAt:ts});
    fhSetStatus(); toast('Registreret som sendt (bekræftet af dig)');
    if(state.view==='wizard'||state.view==='reports') phScrollKeep(()=>render());
  });
}
/* eftersyn: forhåndsvisning af den færdige PDF (pdf.js) */
async function fhPreviewReport(){
  const r=SEND.report; if(!r) return;
  const v=document.createElement('div'); v.id='repView'; v.className='fh-viewer'; v.style.zIndex=320;
  v.innerHTML=`<div class="fh-bar"><button class="fh-back" onclick="document.getElementById('repView').remove()">← Tilbage til afsendelse</button>
    <span class="fh-title" style="flex:0 1 auto;color:#fff">${esc(r.filename)} · ${fhFmtSize(r.blob.size)}</span></div><div class="fh-body" id="repBody"><div class="fh-msg">Åbner rapport…</div></div>`;
  document.body.appendChild(v);
  try{
    if(!window.pdfjsLib) await fhLoadScript(FAGLIG.pdfjsUrl); window.pdfjsLib.GlobalWorkerOptions.workerSrc=FAGLIG.workerUrl;
    const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await r.blob.arrayBuffer())}).promise;
    const body=document.getElementById('repBody'); if(!body) return; body.innerHTML='';
    const avail=Math.max(240,body.clientWidth-16), dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i); const v0=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:avail/v0.width*dpr});
      const w=document.createElement('div'); w.className='fh-page'; const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width=(vp.width/dpr)+'px'; c.style.height=(vp.height/dpr)+'px';
      w.appendChild(c); body.appendChild(w); if(!document.getElementById('repBody')) return;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){ const b=document.getElementById('repBody'); if(b) b.innerHTML='<div class="fh-msg">Rapporten kunne ikke vises her. Brug "Kun download PDF".</div>'; }
}
function sendReportMail(inspId){ openSendReport(inspId); }
