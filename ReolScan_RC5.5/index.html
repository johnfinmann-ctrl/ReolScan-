// AI-fortolkning: udtrækker Lokation (reol-ID), Skadetype, Beskrivelse, Prioritet og Anbefaling fra tale.
// Brugeren skal altid aktivt godkende eller redigere forslagene før Gem — intet gemmes automatisk.
const VOICE_DEFECT_MAP = [
  {kw:['sikringstap','sikringssplit','split'], type:'Manglende sikringstap'},
  {kw:['ankerbolt','anker'], type:'Manglende ankerbolt'},
  {kw:['fodplade'], type:'Beskadiget fodplade'},
  {kw:['skæv diagonal','diagonal'], type:'Skæv diagonal'},
  {kw:['korrosion','rust'], type:'Korrosion'},
  {kw:['påkørselsskade','påkørt stolpe','stolpe er påkørt','stolpe påkørt','påkørsel','påkørt'], type:'Påkørselsskade'},
  {kw:['deformeret','deformation','bulet','bøjet'], type:'Deformation'},
  {kw:['belastningsskilt','skilt'], type:'Manglende belastningsskilt'},
  {kw:['værn','rækværk','påkørselsværn'], type:'Manglende værn'},
  {kw:['revne','revnet'], type:'Revne'},
  {kw:['overbelastning','overbelastet'], type:'Overbelastning'},
  {kw:['stolpe'], type:'Beskadiget stolpe'},
  {kw:['vange'], type:'Beskadiget vange'}
];
function voiceExtractLocation(text){
  // matcher fx "reol a14", "a14", "reol-id a14", "på reol b3"
  const m = text.match(/reol\s*-?\s*([a-zæøå]{1,3}\s?-?\s?\d{1,4})/i) || text.match(/\b([a-zæøå]{1}\d{1,4})\b/i);
  if(!m) return null;
  return m[1].replace(/\s+/g,'').toUpperCase();
}
function voiceExtractDefectType(text){
  for(const entry of VOICE_DEFECT_MAP){
    for(const kw of entry.kw){
      if(text.includes(kw) && DB.config.defectTypes.includes(entry.type)) return entry.type;
    }
  }
  return null;
}
function voiceExtractClassification(text){
  if(text.match(/\brød\b|rød skade|kritisk|akut|straks|farlig|øjeblikkelig/)) return 'red';
  if(text.match(/\bgul\b|gul skade|udskift|reparer|bør|skal udbedres|inden \d+ dage|snarest/)) return 'yellow';
  if(text.match(/\bgrøn\b|grøn skade|ok|fint|ingen problem|kosmetisk/)) return 'green';
  return null;
}
function voiceExtractRecommendation(text, defectType){
  const dayMatch = text.match(/inden\s+(\d+)\s*dage/);
  if(dayMatch) return `Udbedring/udskiftning anbefales inden ${dayMatch[1]} dage.`;
  const standardRec = {
    'Manglende sikringstap':'Montering af ny sikringstap anbefales.',
    'Manglende ankerbolt':'Montering af ny ankerbolt anbefales.',
    'Manglende belastningsskilt':'Opsætning af nyt belastningsskilt anbefales.',
    'Manglende værn':'Montering af nyt værn anbefales.'
  };
  if(text.match(/udskift/)) return standardRec[defectType] || 'Udskiftning anbefales.';
  if(text.match(/monter/)) return 'Montering anbefales.';
  if(text.match(/reparer/)) return 'Reparation anbefales.';
  if(defectType && standardRec[defectType]) return standardRec[defectType];
  if(defectType==='Korrosion') return 'Afrensning og overfladebehandling anbefales.';
  if(defectType==='Revne') return 'Nærmere undersøgelse og evt. udskiftning anbefales.';
  if(defectType==='Overbelastning') return 'Aflastning og kontrol af belastningsgrænser anbefales.';
  if(defectType && (defectType.startsWith('Beskadiget')||defectType==='Deformation'||defectType==='Påkørselsskade'||defectType==='Skæv diagonal')) return 'Reparation eller udskiftning anbefales.';
  return null;
}

function suggestFromVoice(){
  const ta = document.getElementById('voiceTranscriptText');
  const rawText = (ta?ta.value:state.voiceTranscript||'');
  const text = rawText.toLowerCase();
  if(!text.trim()){ toast('Ingen tekst at analysere'); return; }

  const location = voiceExtractLocation(text);
  const defectType = voiceExtractDefectType(text);
  const classification = voiceExtractClassification(text);
  const action = voiceExtractRecommendation(text, defectType);
  // beskrivelse: selve den indtalte sætning, brugt som forslag til "Kort beskrivelse"
  const description = rawText.trim();

  if(!location && !defectType && !classification && !action){
    document.getElementById('voiceSuggestionArea').innerHTML = `<p style="font-size:12px;color:var(--grey-mid);margin-top:8px">AI fandt ingen tydelige forslag i kommentaren. Du kan stadig udfylde felterne manuelt.</p>`;
    return;
  }
  state.voiceSuggestion = {location, defectType, classification, action, description};
  const clsLabels={green:'Grøn',yellow:'Gul',red:'Rød'};
  document.getElementById('voiceSuggestionArea').innerHTML = `
    <div class="voice-suggestion">
      <h4>✨ AI-fortolkning af talen — kontrollér og godkend før brug</h4>
      ${location?`<div class="kv"><b>Lokation:</b> ${esc(location)}</div>`:''}
      ${defectType?`<div class="kv"><b>Skadetype:</b> ${esc(defectType)}</div>`:''}
      <div class="kv"><b>Beskrivelse:</b> ${esc(description)}</div>
      ${classification?`<div class="kv"><b>Prioritet:</b> ${clsLabels[classification]}</div>`:''}
      ${action?`<div class="kv"><b>Anbefaling:</b> ${esc(action)}</div>`:''}
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-green" style="padding:8px 14px;font-size:13px" onclick="applyVoiceSuggestion()">✓ Godkend forslag</button>
        <button class="btn btn-ghost" style="padding:8px 14px;font-size:13px" onclick="document.getElementById('voiceSuggestionArea').innerHTML=''">✎ Afvis / rediger selv</button>
      </div>
      <p style="font-size:11px;color:var(--grey-mid);margin-top:8px">Intet gemmes automatisk — felterne udfyldes først når du trykker "Godkend forslag", og du kan altid rette dem inden du trykker Gem.</p>
    </div>`;
}
function applyVoiceSuggestion(){
  const sug = state.voiceSuggestion;
  if(!sug) return;
  const f = state.workForm;
  if(f){
    if(sug.location){
      const insp = getInspection(state.currentInspectionId);
      const match = insp.reoler.find(r=>r.id.toUpperCase()===sug.location.toUpperCase());
      if(match){ f.locationMode='reolid'; f.reolId=match.id; }
      else { f.locationMode='manual'; f.manualLocation='Reol '+sug.location; }
    }
    if(sug.defectType){
      const typeDef = SKADE_TYPES.find(t=>t.type===sug.defectType);
      if(typeDef) f.types[typeDef.key]=true;
    }
    if(sug.description && !f.desc.trim()){ f.desc = sug.description; }
    if(sug.classification){ f.classification = sug.classification; }
    if(sug.action){ f.desc = (f.desc? f.desc+' ' : '') + sug.action; }
    toast('AI-forslag indsat — kontrollér før du gemmer');
    render();
    return;
  }
  if(sug.location){
    const reolSel = document.getElementById('m_reolId');
    if(reolSel){
      const insp = getInspection(state.currentInspectionId);
      const match = insp.reoler.find(r=>r.id.toUpperCase()===sug.location.toUpperCase());
      if(match){ reolSel.value = match.id; }
    }
    const locInput = document.getElementById('m_location');
    if(locInput && !locInput.value){ locInput.value = 'Reol '+sug.location; }
  }
  if(sug.defectType){
    const sel = document.getElementById('m_defectType');
    if(sel) sel.value = sug.defectType;
  }
  if(sug.description){
    const desc = document.getElementById('m_desc');
    if(desc && !desc.value.trim()){ desc.value = sug.description; }
  }
  if(sug.classification){ selectClass(sug.classification); }
  if(sug.action){
    const kom = document.getElementById('m_kommentar');
    if(kom){ kom.value = (kom.value? kom.value+' ' : '') + sug.action; }
  }
  document.getElementById('voiceSuggestionArea').innerHTML = `<p style="font-size:12px;color:var(--green);font-weight:700;margin-top:8px">✓ Forslag godkendt og indsat i formularen — kontrollér felterne og tryk Gem.</p>`;
  toast('AI-forslag indsat — kontrollér før du gemmer');
}

let sigPads = {};
function setupSigPad(canvasId, existingDataUrl){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth*ratio;
  canvas.height = canvas.offsetHeight*ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio,ratio);
  ctx.strokeStyle = '#00305F';
  ctx.lineWidth = 2.5;
  ctx.lineCap='round';
  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; e.preventDefault();
  }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);
  sigPads[canvasId]=canvas;
  if(existingDataUrl){
    const img = new Image();
    img.onload=()=>ctx.drawImage(img,0,0,canvas.offsetWidth,canvas.offsetHeight);
    img.src=existingDataUrl;
  }
}
function clearSig(which){
  const canvas = document.getElementById('sig'+which);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('sigStatus'+which).textContent='Ikke underskrevet';

      <div class="completion-secondary">

        <button class="btn btn-ghost" onclick="state.view='reports';render()">📄 Alle rapporter</button>

  }
  const ready = insp.reoler.length>0 && !!insp.vurdering;
  return `
  <div class="panel">
    <h2><span class="num">6</span> Afslut eftersyn</h2>
    <div class="formgrid" style="margin-bottom:18px">
      <div class="stat-card"><div class="n">${insp.reoler.length}</div><div class="l">Reoler registreret</div></div>
      <div class="stat-card"><div class="n">${insp.skader.length}</div><div class="l">Skader registreret</div></div>
      <div class="stat-card ${insp.signatures.inspector&&insp.signatures.customer?'green':'yellow'}"><div class="n">${insp.signatures.inspector&&insp.signatures.customer?'✓':'!'}</div><div class="l">Underskrifter</div></div>
    </div>

    ${(()=>{const c=ctrlSummary(insp);return `<div class="fh-afslut ${c.unc?'warn':''}">Kontrolliste: <b>${c.done} af ${c.total}</b> kontrolleret · ${c.unc} ikke kontrolleret${c.fejl?' · '+c.fejl+' afvigelse(r)':''}. ${c.unc?'Rapporten viser tydeligt, at disse punkter ikke er kontrolleret. <a href="#" onclick="event.preventDefault();state.fhCtrlOpen=true;setWizardTab(\'skader\')">Åbn kontrolliste</a>':''}</div>`;})()}
    <div class="field full" style="margin-bottom:6px"><label>Samlet vurdering af eftersynet</label></div>
    <div class="tagclass-row" id="vurderingRow" data-selected="${insp.vurdering||''}">
      ${Object.entries(VURDERING_META).map(([key,m])=>`
        <div class="tagclass ${key} ${insp.vurdering===key?'sel':''}" data-cls="${key}" onclick="selectVurdering('${key}')">
          <div class="lab">${m.emoji} ${m.label}</div>
        </div>`).join('')}
    </div>

    <p style="font-size:13px;color:var(--grey-mid);margin-top:14px">Ved afslutning genereres rapportnummer automatisk, næste eftersyn beregnes (+12 måneder), og eftersynet flyttes til <strong>Rapporter</strong>. Ingen data slettes.</p>
    <div class="btn-row">
      <button class="btn btn-green btn-lg" onclick="finishInspection()" ${ready?'':'disabled'}>✅ Afslut eftersyn og generér rapport</button>
    </div>
    ${!ready?'<p style="font-size:12px;color:var(--red);margin-top:8px">Tilføj mindst én reol i Reolregister før afslutning.</p>':''}
    ${insp.reoler.length>0 && !insp.vurdering ? '<p style="font-size:12px;color:var(--red);margin-top:8px">Vælg samlet vurdering for at afslutte — godkendelsen foretages af inspektøren, ikke af ReolScan.</p>':''}
  </div>`;
}
function selectVurdering(key){
  const insp = getInspection(state.currentInspectionId);
  insp.vurdering = key;
  saveDB(DB);
  document.querySelectorAll('#vurderingRow .tagclass').forEach(el=>el.classList.toggle('sel', el.dataset.cls===key));
}
function finishInspection(){
  const insp = getInspection(state.currentInspectionId);
  if(!insp.vurdering){ toast('Vælg samlet vurdering — den foretages af inspektøren'); return; }
  const closedCount = DB.inspections.filter(i=>i.status==='closed').length;
  insp.reportNumber = 'RS-'+ (new Date(insp.date)).getFullYear() + '-' + String(closedCount+1).padStart(4,'0');
  const next = new Date(insp.date);
  next.setMonth(next.getMonth()+12);
  insp.nextInspection = next.toISOString().slice(0,10);
  insp.status='closed';
  prepareReportMail(insp);
  saveDB(DB);
  render();
  toast('Eftersyn afsluttet — rapport '+insp.reportNumber+' oprettet');
}
function prepareReportMail(insp){
  const c = DB.customers.find(x=>x.id===insp.customerId);
  if(!c) return;
  const mc = c.mailConfig || defaultMailConfig(c);
  const body = (mc.template||'').replace('{RAPPORTNUMMER}', insp.reportNumber).replace('{DATO}', fmtDate(insp.date));
  DB.mailLog = DB.mailLog || [];
  DB.mailLog.push({
    id: uid('mail'),
    customerId: c.id,
    inspectionId: insp.id,
    to: mc.email || c.email || '',
    cc: mc.cc || '',
    subject: `Reoleftersyn ${insp.reportNumber} — ${c.name}`,
    body,
    date: todayISO(),
    status: 'klargjort'   // RC5.5: aldrig 'sendt' uden inspektørens egen bekræftelse
  });
}

/* run sigpad setup after wizard render if on underskrift tab */

render = function(){

    const insp = getInspection(state.currentInspectionId);
    setTimeout(()=>{
      setupSigPad('sigInspector', insp.signatures.inspector);
      setupSigPad('sigCustomer', insp.signatures.customer);
    },0);
  }
};

function printReport(inspId){
  // Generate PDF first, then user can print from their PDF viewer
  generatePDF(inspId);
  toast('PDF downloadet — åbn filen for at udskrive');
}
/* sharePDF — Web Share API hvis tilgængeligt, ellers Download PDF.
   Ingen mailto i v1.0. SMTP/Microsoft 365-integration planlagt til v1.1.
   v1.0: Del via Web Share API (tekst + URL). Fildeling tilføjes i v1.1 når PDF-builder er refaktoreret til at returnere blob. */
function sharePDF(inspId){
  const insp = getInspection(inspId);
  if(!insp){ toast('Eftersyn ikke fundet'); return; }

  if(typeof navigator.share === 'undefined'){
    // Web Share API ikke understøttet (fx Windows Chrome desktop) — download i stedet
    generatePDF(inspId);
    toast('Del-funktion ikke understøttet i denne browser — PDF downloadet');
    return;
  }

  // Web Share API tilgængeligt — del rapport-info + instruer bruger om at vedhæfte PDF
  generatePDF(inspId); // download PDF lokalt så brugeren kan vedhæfte den manuelt
  const shareData = {
    title: 'Reoleftersyn ' + insp.reportNumber,
    text: 'Reoleftersyn for ' + insp.customerName + '\nDato: ' + fmtDate(insp.date) + '\nInspektør: ' + (insp.inspector||getInspectorName()) + '\n\nPDF er downloadet og kan vedhæftes manuelt.'
  };
  navigator.share(shareData)
    .then(()=>toast('Delt'))
    .catch(err=>{ if(err.name!=='AbortError') toast('Deling annulleret'); });
}

/* =========================================================
   DASHBOARD
========================================================= */
function renderDashboard(){
  const all = DB.inspections;
  const allSkader = all.flatMap(i=>i.skader);
  const allReoler = all.flatMap(i=>i.reoler);
  const counts = {green:0,yellow:0,red:0};
  allSkader.forEach(s=>counts[s.classification]++);
  const open = allSkader.filter(s=>s.status!=='Lukket').length;
  const closedSk = allSkader.filter(s=>s.status==='Lukket').length;
  const total = allSkader.length || 1;
  const today = todayISO();

  const critical = allSkader.filter(s=>s.classification==='red' && s.status!=='Lukket');
  const overdue = allSkader.filter(s=>s.deadline && s.status!=='Lukket' && s.deadline<today);

  // Top fejl
  const defectCounts = {};
  allSkader.forEach(s=>defectCounts[s.defectType]=(defectCounts[s.defectType]||0)+1);

  // Customers: upcoming inspections & follow-up needed
  const customerInfo = DB.customers.map(c=>{
    const insps = DB.inspections.filter(i=>i.customerId===c.id);
    const closedInsps = insps.filter(i=>i.status==='closed').sort((a,b)=>b.date.localeCompare(a.date));
    const next = closedInsps[0]?closedInsps[0].nextInspection:null;
    const allSk = insps.flatMap(i=>i.skader);
    const openSk = allSk.filter(s=>s.status!=='Lukket');
    // year-over-year improvement (latest two closed inspections)
    let improvement = null;
    if(closedInsps.length>=2){
      const latest = closedInsps[0].skader.length, prev = closedInsps[1].skader.length;
      if(prev>0) improvement = Math.round((latest-prev)/prev*100);
    }
    return {id:c.id, name:c.name, next, openCount:openSk.length, critCount:openSk.filter(s=>s.classification==='red').length, totalSkader:allSk.length, improvement};
  });
  const upcoming = customerInfo.filter(c=>c.next && c.next>=today && daysBetween(today,c.next)<=60).sort((a,b)=>a.next.localeCompare(b.next));
  const needsFollowup = customerInfo.filter(c=>c.openCount>0);
  const overdueCustomers = customerInfo.filter(c=>c.next && c.next<today);
  const improved = customerInfo.filter(c=>c.improvement!==null && c.improvement<0).sort((a,b)=>a.improvement-b.improvement);

  // top10 lokationer / reoler (all years)
  const locCounts={}, reolCounts={};
  allSkader.forEach(s=>{
    locCounts[s.location||'Ukendt']=(locCounts[s.location||'Ukendt']||0)+1;
    reolCounts[s.reolId]=(reolCounts[s.reolId]||0)+1;
  });
  const top10Loc = Object.entries(locCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const top10Reol = Object.entries(reolCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxLoc10 = top10Loc.length? top10Loc[0][1]:1;
  const maxReol10 = top10Reol.length? top10Reol[0][1]:1;

  // kritiske fejl pr. måned
  const monthCounts={};
  allSkader.filter(s=>s.classification==='red').forEach(s=>{ const mo=s.date.slice(0,7); monthCounts[mo]=(monthCounts[mo]||0)+1; });
  const months = Object.entries(monthCounts).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxMonth = months.length? Math.max(...months.map(m=>m[1])):1;

  const allKpiClosed = DB.inspections.filter(i=>i.status==='closed' && i.nextInspection).map(i=>i.nextInspection).sort();
  const nextEftersyn = allKpiClosed.find(d=>d>=today) || allKpiClosed[0] || null;

  const top10 = Object.entries(defectCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxTop10 = top10.length? top10[0][1] : 1;

  const reolZone={}; DB.inspections.forEach(i=>i.reoler.forEach(r=>{ if(!reolZone[r.id]) reolZone[r.id]=r.hal||r.zone; }));
  const haleCounts={};
  allSkader.forEach(s=>{ const hal=reolZone[s.reolId]||'Ukendt'; haleCounts[hal]=(haleCounts[hal]||0)+1; });
  const topHal = Object.entries(haleCounts).sort((a,b)=>b[1]-a[1]);
  const maxHal = topHal.length? topHal[0][1] : 1;

  const closedInspsAll = DB.inspections.filter(i=>i.status==='closed');
  const vurderingCounts = {green:0,yellow:0,red:0};
  closedInspsAll.forEach(i=>{ if(i.vurdering) vurderingCounts[i.vurdering]++; });

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${DB.customers.length}</div><div class="l">Kunder</div></div>
    <div class="stat-card"><div class="n">${all.length}</div><div class="l">Eftersyn</div></div>
    <div class="stat-card"><div class="n">${allReoler.length}</div><div class="l">Reoler</div></div>
    <div class="stat-card"><div class="n">${allSkader.length}</div><div class="l">Skader i alt</div></div>
    <div class="stat-card red"><div class="n">${critical.length}</div><div class="l">Kritiske fejl (åbne)</div></div>
    <div class="stat-card"><div class="n">${open}</div><div class="l">Åbne fejl</div></div>
    <div class="stat-card green"><div class="n">${closedSk}</div><div class="l">Lukkede fejl</div></div>
    <div class="stat-card red"><div class="n">${overdue.length}</div><div class="l">Overskredne deadlines</div></div>
    <div class="stat-card"><div class="n" style="font-size:22px">${nextEftersyn?fmtDate(nextEftersyn):'—'}</div><div class="l">Næste eftersyn</div></div>
  </div>

  <div class="formgrid">
    <div class="panel">
      <h2>Top 10 fejl</h2>
      ${top10.length? `<div class="bars">${top10.map(([d,c])=>`<div class="bar-row"><div class="label">${esc(d)}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxTop10*100}%;background:var(--navy)"></div></div><div class="val">${c}</div></div>`).join('')}</div>` : '<p style="font-size:13px;color:var(--grey-mid)">Ingen skader registreret endnu.</p>'}
    </div>
    <div class="panel">
      <h2>Top fejl pr. hal</h2>
      ${topHal.length? `<div class="bars">${topHal.map(([h,c])=>`<div class="bar-row"><div class="label">${esc(h)}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxHal*100}%;background:var(--navy-2)"></div></div><div class="val">${c}</div></div>`).join('')}</div>` : '<p style="font-size:13px;color:var(--grey-mid)">Ingen data.</p>'}
    </div>
  </div>

  <div class="formgrid">
    <div class="panel">
      <h2>Samlet vurdering (alle afsluttede eftersyn)</h2>
      <div class="formgrid">
        <div class="stat-card green"><div class="n">${vurderingCounts.green}</div><div class="l">🟢 Godkendt</div></div>
        <div class="stat-card yellow"><div class="n">${vurderingCounts.yellow}</div><div class="l">🟡 Med bemærkninger</div></div>
        <div class="stat-card red"><div class="n">${vurderingCounts.red}</div><div class="l">🔴 Ikke godkendt</div></div>
      </div>
    </div>
    <div class="panel">
      <h2>Kunder med flest fejl</h2>
      ${customerInfo.length? customerInfo.slice().sort((a,b)=>b.totalSkader-a.totalSkader).slice(0,5).map(c=>`<div class="report-list-item"><div class="info"><h4>${esc(c.name)}</h4><div class="meta">${c.totalSkader} skader i alt</div></div>${c.critCount?`<span class="pill red">${c.critCount} kritisk</span>`:''}</div>`).join('') : '<p style="font-size:13px;color:var(--grey-mid)">Ingen data.</p>'}
    </div>
  </div>

  <div class="formgrid">
    <div class="panel">
      <h2>Top 10 lokationer</h2>
      ${top10Loc.length? `<div class="bars">${top10Loc.map(([l,c])=>`<div class="bar-row"><div class="label" title="${esc(l)}">${esc(l.length>22?l.slice(0,20)+'…':l)}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxLoc10*100}%;background:var(--navy)"></div></div><div class="val">${c}</div></div>`).join('')}</div>` : '<p style="font-size:13px;color:var(--grey-mid)">Ingen data.</p>'}
    </div>
    <div class="panel">
      <h2>Top 10 reoler</h2>
      ${top10Reol.length? `<div class="bars">${top10Reol.map(([r,c])=>`<div class="bar-row"><div class="label mono">${esc(r)}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxReol10*100}%;background:var(--navy)"></div></div><div class="val">${c}</div></div>`).join('')}</div>` : '<p style="font-size:13px;color:var(--grey-mid)">Ingen data.</p>'}
    </div>
  </div>

  <div class="formgrid">
    <div class="panel">
      <h2>Kritiske fejl pr. måned</h2>
      ${months.length? `<div class="bars">${months.map(([mo,c])=>`<div class="bar-row"><div class="label">${mo}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxMonth*100}%;background:var(--red)"></div></div><div class="val">${c}</div></div>`).join('')}</div>` : '<p style="font-size:13px;color:var(--grey-mid)">Ingen kritiske skader registreret endnu.</p>'}
    </div>
    <div class="panel">
      <h2>Kunder med størst forbedring</h2>
      ${improved.length? improved.slice(0,5).map(c=>`<div class="report-list-item"><div class="info"><h4>${esc(c.name)}</h4><div class="meta">Færre skader end ved seneste eftersyn</div></div><span class="pill green">${c.improvement}%</span></div>`).join('') : '<p style="font-size:13px;color:var(--grey-mid)">Endnu ikke nok historik (kræver mindst 2 afsluttede eftersyn pr. kunde).</p>'}
    </div>
  </div>

  <div class="formgrid">
    <div class="panel">
      <h2>Overskredne eftersyn</h2>
      ${overdueCustomers.length? overdueCustomers.map(c=>`<div class="report-list-item"><div class="info"><h4>${esc(c.name)}</h4><div class="meta">Næste eftersyn var ${fmtDate(c.next)}</div></div><span class="pill red">${daysBetween(c.next,today)} dage forsinket</span></div>`).join('') : '<p style="font-size:13px;color:var(--grey-mid)">Ingen overskredne eftersyn.</p>'}
    </div>
    <div class="panel">
      <h2>Kunder med kommende eftersyn (60 dage)</h2>
      ${upcoming.length? upcoming.map(c=>`<div class="report-list-item"><div class="info"><h4>${esc(c.name)}</h4><div class="meta">Næste eftersyn ${fmtDate(c.next)}</div></div><span class="pill grey">${daysBetween(today,c.next)} dage</span></div>`).join('') : '<p style="font-size:13px;color:var(--grey-mid)">Ingen eftersyn forfalder inden for 60 dage.</p>'}

    <div class="panel">
      <h2>Kunder med manglende opfølgning</h2>

  <div class="panel">
    <h2>Skadeklassificering</h2>

      <div class="bar-row"><div class="label">Grøn</div><div class="bar-track"><div class="bar-fill" style="width:${counts.green/total*100}%;background:var(--green)"></div></div><div class="val">${counts.green}</div></div>

    </div>

  `;

/* =========================================================
   CUSTOMER ARCHIVE (basic, functional)

function renderCustomerArchive(){
  const today = todayISO();
  return `
  <div class="panel">
    <h2>Kundearkiv (${DB.customers.length})</h2>
    <p style="font-size:13px;color:var(--grey-mid);margin-top:-6px">Status: <span class="status-badge ok" style="padding:2px 9px">OK</span> ingen åbne kritiske skader og eftersyn ikke overskredet · <span class="status-badge followup" style="padding:2px 9px">Kræver opfølgning</span> åbne røde/gule skader · <span class="status-badge overdue" style="padding:2px 9px">Eftersyn overskredet</span> næste eftersyn er passeret.</p>
  </div>
  <div class="cust-grid">
  ${DB.customers.map(c=>{
    const insps = DB.inspections.filter(i=>i.customerId===c.id);
    const closedInsps = insps.filter(i=>i.status==='closed').sort((a,b)=>b.date.localeCompare(a.date));
    const last = closedInsps[0];
    const next = last ? last.nextInspection : null;
    const allSkader = insps.flatMap(i=>i.skader);
    const openSkader = allSkader.filter(s=>s.status!=='Lukket');
    const critical = openSkader.filter(s=>s.classification==='red');

    let status, statusClass;
    if(!last){ status='Intet eftersyn endnu'; statusClass='none'; }
    else if(next && next < today){ status='Eftersyn overskredet'; statusClass='overdue'; }
    else if(critical.length>0){ status='Kræver opfølgning'; statusClass='followup'; }
    else if(openSkader.length>0){ status='Kræver opfølgning'; statusClass='followup'; }
    else{ status='OK'; statusClass='ok'; }

    return `
    <div class="cust-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div>
          <h3>${esc(c.name)}</h3>

        <div><b>CVR</b>${esc(c.cvr||'—')}</div>
        <div><b>Kontaktperson</b>${esc(c.contact||'—')}</div>
        <div><b>Fast eftersyns-mail</b>${esc(c.email||'—')}</div>
        <div><b>Sidste eftersyn</b>${last?fmtDate(last.date):'—'}</div>
        <div><b>Næste eftersyn</b>${next?fmtDate(next):'—'}</div>
        <div><b>Åbne / kritiske skader</b>${openSkader.length} / <span style="color:${critical.length?'var(--red)':'inherit'};font-weight:700">${critical.length}</span></div>
      </div>
      ${(()=>{
        if(closedInsps.length<1) return '';
        const byYear = closedInsps.slice().sort((a,b)=>a.date.localeCompare(b.date));
        const rows = byYear.map((i,idx)=>{
          const sk=i.skader; const crit=sk.filter(s=>s.classification==='red').length;
          const openN=sk.filter(s=>s.status!=='Lukket').length; const closedN=sk.length-openN;
          const prev = idx>0? byYear[idx-1].skader.length : null;
          const change = prev!==null && prev>0 ? Math.round((sk.length-prev)/prev*100) : null;
          return {year:i.date.slice(0,4), total:sk.length, crit, openN, closedN, change};
        });
        return `
        <div style="font-size:12px;font-weight:700;color:var(--grey-mid);text-transform:uppercase;letter-spacing:.08em;margin-top:10px;margin-bottom:6px">Benchmark mellem år</div>

          <tbody>

              <td><strong>${r.year}</strong></td><td>${r.total}</td><td>${r.crit}</td><td>${r.openN}</td><td>${r.closedN}</td>
              <td>${r.change===null?'—':(r.change<=0?`<span class="pill green">↓ ${r.change}%</span>`:`<span class="pill red">↑ +${r.change}%</span>`)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
      })()}
      ${closedInsps.length? `
      <div style="font-size:12px;font-weight:700;color:var(--grey-mid);text-transform:uppercase;letter-spacing:.08em;margin-top:10px;margin-bottom:6px">Tidligere rapporter</div>
      <div class="btn-row" style="margin-top:0">
        ${closedInsps.map(i=>`<button class="btn btn-ghost" style="padding:8px 12px;font-size:12px" onclick="generatePDF('${i.id}')">📄 ${esc(i.reportNumber)} · ${fmtDate(i.date)}</button>`).join('')}
      </div>` : `<p style="font-size:13px;color:var(--grey-mid);margin-top:10px">Ingen afsluttede eftersyn endnu.</p>`}

      <div style="font-size:12px;font-weight:700;color:var(--grey-mid);text-transform:uppercase;letter-spacing:.08em;margin-top:14px;margin-bottom:6px">
        Dokumentarkiv
        ${DOC_TYPES.map(dt=>{ const n=(c.documents||[]).filter(d=>d.type===dt.label).length; return n?`<span class="pill grey" style="font-size:10px;margin-left:4px">${dt.icon} ${n}</span>`:''; }).join('')}
        <span class="pill grey" style="font-size:10px;margin-left:4px">I alt ${(c.documents||[]).length}</span>
      </div>
      <input id="docsearch_${c.id}" placeholder="🔎 Søg i dokumenter (filnavn, type, uploadet af)..." oninput="filterCustomerDocs('${c.id}',this.value)" style="border:1.5px solid var(--grey-line);border-radius:10px;padding:9px 12px;font-size:13px;width:100%;margin-bottom:8px">
      <div id="docsList_${c.id}">${renderCustomerDocArchive(c)}</div>
      <div class="btn-row" style="margin-top:8px">
        ${DOC_TYPES.map(t=>`
          <label class="btn btn-ghost" style="padding:8px 12px;font-size:12px;cursor:pointer">
            ➕ ${t.icon} ${t.label}
            <input type="file" accept="application/pdf,image/*" style="display:none" onchange="uploadCustomerDoc('${c.id}','${t.label}',event)">
          </label>`).join('')}
      </div>
    </div>`;
  }).join('')}
  </div>`;
}
const DOC_TYPES = [
  {label:'Tegninger', icon:'🗺️'}, {label:'Belastningsskilte', icon:'🏷️'}, {label:'Certifikater', icon:'📜'},
  {label:'Montagevejledninger', icon:'🔧'}, {label:'Inspektionsrapporter', icon:'📋'}, {label:'Reparationsrapporter', icon:'🛠️'},
  {label:'Billeder', icon:'🖼️'}, {label:'Andet', icon:'📄'}
];
function renderCustomerDocArchive(c, filter){
  filter = (filter||'').toLowerCase();
  const docs = (c.documents||[]).filter(d=>
    !filter ||
    (d.name||'').toLowerCase().includes(filter) ||
    (d.type||'').toLowerCase().includes(filter) ||
    (d.uploadedBy||'').toLowerCase().includes(filter)
  );
  if(!(c.documents||[]).length) return `<p style="font-size:13px;color:var(--grey-mid);margin:0">Ingen dokumenter uploadet endnu.</p>`;
  if(!docs.length) return `<p style="font-size:13px;color:var(--grey-mid);margin:0">Ingen dokumenter matcher søgningen.</p>`;

  const byType = {};
  DOC_TYPES.forEach(t=>byType[t.label]=[]);
  docs.forEach(d=>{ const key = DOC_TYPES.find(t=>t.label===d.type)?.label||'Andet'; (byType[key]=byType[key]||[]).push(d); });

  return DOC_TYPES.map(dt=>{
    const group = byType[dt.label]||[];
    if(!group.length) return '';
    return `
    <div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--grey-mid);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">${dt.icon} ${dt.label} <span class="pill grey" style="font-size:10px">${group.length}</span></div>
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="font-size:11px">
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--grey-line);color:var(--grey-mid)">Filnavn</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--grey-line);color:var(--grey-mid)">Dato</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--grey-line);color:var(--grey-mid)">Uploadet af</th>
          <th style="padding:6px 8px;border-bottom:1px solid var(--grey-line)"></th>
        </tr></thead>
        <tbody>
          ${group.map(d=>`
          <tr style="font-size:13px">
            <td style="padding:8px 8px;border-bottom:1px solid var(--grey-line)">${dt.icon} ${esc(d.name)}</td>
            <td style="padding:8px 8px;border-bottom:1px solid var(--grey-line);color:var(--grey-mid)">${fmtDate(d.dateAdded||'')}</td>
            <td style="padding:8px 8px;border-bottom:1px solid var(--grey-line);color:var(--grey-mid)">${esc(d.uploadedBy||'—')}</td>
            <td style="padding:8px 8px;border-bottom:1px solid var(--grey-line);white-space:nowrap">
              <button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="viewCustomerDoc(${JSON.stringify(d).replace(/"/g,'&quot;')})">Åbn</button>
              <a class="btn btn-ghost" href="${d.data}" download="${esc(d.name)}" style="padding:5px 10px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center">⬇️</a>
              <button class="icon-btn" onclick="removeCustomerDoc('${c.id}','${esc(d.id||String(c.documents.indexOf(d)))}')" title="Slet">✕</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }).join('');
}
function renderCustomerDocButtons(c, filter){ return renderCustomerDocArchive(c, filter); }
function filterCustomerDocs(custId, term){
  const c = DB.customers.find(x=>x.id===custId);
  document.getElementById('docsList_'+custId).innerHTML = renderCustomerDocArchive(c, term);
}
function uploadCustomerDoc(custId, type, e){
  const file = e.target.files[0];
  if(!file) return;
  const insp = DB.inspections.filter(i=>i.customerId===custId && i.status==='open')[0];
  const inspector = insp ? insp.inspector : 'John Finmann';
  const reader = new FileReader();
  reader.onload = ev=>{
    const c = DB.customers.find(x=>x.id===custId);
    c.documents = c.documents || [];
    c.documents.push({
      id: uid('doc'),
      name: file.name,
      type,
      data: ev.target.result,
      dateAdded: todayISO(),
      uploadedBy: inspector,
      size: file.size
    });
    saveDB(DB); render();
    toast(type+' "'+file.name+'" uploadet');
  };
  reader.readAsDataURL(file);
}
function removeCustomerDoc(custId, docId){
  const c = DB.customers.find(x=>x.id===custId);
  const idx = c.documents.findIndex(d=>(d.id||'')===docId || c.documents.indexOf(d)===Number(docId));
  if(idx!==-1) c.documents.splice(idx,1);
  saveDB(DB); render();
}
function viewCustomerDoc(d){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='genericModalOverlay';
  overlay.onclick=(e)=>{ if(e.target===overlay) closeGenericModal(); };
  const isPDF = d.data && (d.data.startsWith('data:application/pdf') || d.name.toLowerCase().endsWith('.pdf'));
  const isImage = d.data && d.data.startsWith('data:image');
  const preview = isPDF
    ? `<embed src="${d.data}" type="application/pdf" style="width:100%;height:420px;border-radius:8px">`
    : isImage
      ? `<img src="${d.data}" style="max-width:100%;border-radius:8px;border:1px solid var(--grey-line)">`
      : `<div class="empty" style="margin:20px 0"><span class="icon">📄</span><p>${esc(d.name)}</p></div>`;
  overlay.innerHTML = `
    <div class="modal" style="max-width:520px">
      <button class="modal-close" onclick="closeGenericModal()">✕</button>
      <h2 style="font-size:15px;text-transform:none;font-family:'Inter',sans-serif;font-weight:700">${esc(d.name)}</h2>
      ${preview}
      <div class="btn-row" style="margin-top:12px">
        <a class="btn btn-primary" href="${d.data}" download="${esc(d.name)}" style="text-decoration:none">⬇️ Download</a>
        <button class="btn btn-ghost" onclick="closeGenericModal()">Luk</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
function viewCustomerDocImage(data){ viewCustomerDoc({data, name:'Billede'}); }

function toggleHist(key){ state.histExpand[key] = !state.histExpand[key]; render(); }

function renderHistory(){
  const rows = DB.customers.map(c=>{
    const insps = DB.inspections.filter(i=>i.customerId===c.id && i.status==='closed').sort((a,b)=>b.date.localeCompare(a.date));
    if(!insps.length) return '';
    const years = [...new Set(insps.map(i=>i.date.slice(0,4)))].sort((a,b)=>b-a);
    const expC = !!state.histExpand[c.id];
    return `<div class="hist-customer">
      <div class="hist-row" onclick="toggleHist('${c.id}')">
        <strong>🏢 ${esc(c.name)}</strong>
        <span>${expC?'▾':'▸'} ${insps.length} arkiveret${insps.length===1?'':'e'} eftersyn</span>
      </div>
      ${expC ? years.map(y=>{
        const yearInsps = insps.filter(i=>i.date.startsWith(y));
        const key = c.id+'-'+y;
        const expY = !!state.histExpand[key];
        return `<div class="hist-year">
          <div class="hist-row sub" onclick="toggleHist('${key}')">📅 ${y}<span>${expY?'▾':'▸'} ${yearInsps.length}</span></div>
          ${expY ? yearInsps.map(i=>{
            const photoCount = i.skader.reduce((a,s)=>a+(s.photos?s.photos.length:0),0);
            return `<div class="hist-insp">
              <div><strong>Reoleftersyn ${fmtDate(i.date)}</strong> <span class="mono" style="font-size:12px;color:var(--grey-mid)">${esc(i.reportNumber)}</span></div>
              <div class="meta" style="font-size:12px;color:var(--grey-mid);margin-top:2px">${i.reoler.length} reoler · ${i.skader.length} skader · næste eftersyn ${fmtDate(i.nextInspection)}</div>
              <div class="btn-row" style="margin-top:10px">
                <button class="btn btn-ghost" style="padding:9px 14px;font-size:13px" onclick="generatePDF('${i.id}')">📄 PDF</button>
                <button class="btn btn-ghost" style="padding:9px 14px;font-size:13px" onclick="showImagesModal('${i.id}')">🖼️ Billeder (${photoCount})</button>
                <button class="btn btn-ghost" style="padding:9px 14px;font-size:13px" onclick="state.currentInspectionId='${i.id}';state.wizardTab='skader';state.view='wizard';render()">⚠️ Skader (${i.skader.length})</button>
                <button class="btn btn-ghost" style="padding:9px 14px;font-size:13px" onclick="showSignaturesModal('${i.id}')">✍️ Underskrifter</button>
              </div>
            </div>`;
          }).join('') : ''}
        </div>`;
      }).join('') : ''}
    </div>`;
  }).join('');

  return `
  <div class="panel">
    <h2>Historik</h2>
    <p style="font-size:13px;color:var(--grey-mid)">Struktur: <strong>Kunde → år → eftersyn</strong> → rapport (PDF), billeder, skader og underskrifter. Alt arkiveres automatisk ved afslutning af et eftersyn — intet kan slettes herfra.</p>
    ${rows || emptyState('📚','Ingen arkiverede eftersyn','Afslut et eftersyn for at se det i historikken.')}
  </div>`;
}

/* =========================================================
   STATISTIK (flere år)
========================================================= */
function renderStats(){
  const years = [...new Set(DB.inspections.map(i=>i.date.slice(0,4)))].sort();
  const skaderByYear = {};
  years.forEach(y=>skaderByYear[y]=[]);
  DB.inspections.forEach(i=>{
    const y = i.date.slice(0,4);
    i.skader.forEach(s=>skaderByYear[y].push({...s, customer:i.customerName}));
  });
  const allSkader = years.flatMap(y=>skaderByYear[y]);

  const eftersynByYear = {};
  years.forEach(y=>eftersynByYear[y]=DB.inspections.filter(i=>i.date.startsWith(y)).length);

  const maxTotal = Math.max(1, ...years.map(y=>skaderByYear[y].length));

  // top defects
  const defectCounts={};
  allSkader.forEach(s=>defectCounts[s.defectType]=(defectCounts[s.defectType]||0)+1);
  const topDefects = Object.entries(defectCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxDefect = topDefects.length? topDefects[0][1] : 1;

  // by location
  const locCounts={};
  allSkader.forEach(s=>locCounts[s.location||'Ukendt']=(locCounts[s.location||'Ukendt']||0)+1);
  const topLoc = Object.entries(locCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxLoc = topLoc.length? topLoc[0][1] : 1;

  // by reol
  const reolCounts={};
  allSkader.forEach(s=>reolCounts[s.reolId]=(reolCounts[s.reolId]||0)+1);
  const topReol = Object.entries(reolCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxReol = topReol.length? topReol[0][1] : 1;

  // by zone (lookup zone from any inspection's reolregister)
  const reolZone = {};
  DB.inspections.forEach(i=>i.reoler.forEach(r=>{ if(!reolZone[r.id]) reolZone[r.id]=r.hal||r.zone; }));
  const zoneCounts={};
  allSkader.forEach(s=>{ const z=reolZone[s.reolId]||'Ukendt'; zoneCounts[z]=(zoneCounts[z]||0)+1; });
  const topZone = Object.entries(zoneCounts).sort((a,b)=>b[1]-a[1]);
  const maxZone = topZone.length? topZone[0][1] : 1;

  // avg resolution time
  const resolved = allSkader.filter(s=>s.resolvedDate);
  const avgDays = resolved.length ? Math.round(resolved.reduce((a,s)=>a+daysBetween(s.date,s.resolvedDate),0)/resolved.length) : null;

  return `
  <div class="panel">
    <h2>Statistik — udvikling over flere år</h2>
    <table>
      <thead><tr><th>År</th><th>Eftersyn</th><th>Skader i alt</th><th>Grøn</th><th>Gul</th><th>Rød</th><th>Vurdering</th></tr></thead>
      <tbody>
        ${years.map(y=>{
          const sk=skaderByYear[y];
          const c={green:0,yellow:0,red:0}; sk.forEach(s=>c[s.classification]++);
          const yearInsps = DB.inspections.filter(i=>i.date.startsWith(y) && i.status==='closed' && i.vurdering);
          const vBadges = yearInsps.map(i=>`<span class="pill ${i.vurdering}" title="${esc(i.customerName)}" style="font-size:10px">${VURDERING_META[i.vurdering].emoji}</span>`).join(' ');
          return `<tr>
            <td><strong>${y}</strong></td>
            <td>${eftersynByYear[y]}</td>
            <td>${sk.length}</td>
            <td><span class="pill green">${c.green}</span></td>
            <td><span class="pill yellow">${c.yellow}</span></td>
            <td><span class="pill red">${c.red}</span></td>
            <td>${vBadges||'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="bars" style="margin-top:18px">
      ${years.map(y=>`<div class="bar-row"><div class="label">${y}</div><div class="bar-track"><div class="bar-fill" style="width:${skaderByYear[y].length/maxTotal*100}%;background:var(--navy)"></div></div><div class="val">${skaderByYear[y].length}</div></div>`).join('')}
    </div>
  </div>

  <div class="panel">
    <h2>Top 10 fejltyper (alle år)</h2>
    ${topDefects.length? `<div class="bars">
      ${topDefects.map(([d,c])=>`<div class="bar-row"><div class="label">${esc(d)}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxDefect*100}%;background:var(--navy)"></div></div><div class="val">${c}</div></div>`).join('')}
    </div>` : '<p style="font-size:13px;color:var(--grey-mid)">Ingen skader registreret endnu.</p>'}
  </div>

  <div class="formgrid">
    <div class="panel">
      <h2>Skader pr. lokation</h2>
      <div class="bars">
        ${topLoc.map(([l,c])=>`<div class="bar-row"><div class="label" title="${esc(l)}">${esc(l.length>22?l.slice(0,20)+'…':l)}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxLoc*100}%;background:var(--navy-2)"></div></div><div class="val">${c}</div></div>`).join('') || '<p style="font-size:13px;color:var(--grey-mid)">Ingen data.</p>'}
      </div>
    </div>
    <div class="panel">
      <h2>Skader pr. reol</h2>
      <div class="bars">
        ${topReol.map(([r,c])=>`<div class="bar-row"><div class="label mono">${esc(r)}</div><div class="bar-track"><div class="bar-fill" style="width:${c/maxReol*100}%;background:var(--navy-2)"></div></div><div class="val">${c}</div></div>`).join('') || '<p style="font-size:13px;color:var(--grey-mid)">Ingen data.</p>'}
      </div>
    </div>

/* =========================================================
   AUTOMATISKE PÅMINDELSER (simuleret mail-log)
========================================================= */
function addDays(dateStr, days){
  const d = new Date(dateStr);
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function buildMailLog(){
  const today = todayISO();
  const entries = [];
  DB.inspections.filter(i=>i.status==='closed' && i.nextInspection).forEach(i=>{
    [60,30,7].forEach(daysBefore=>{
      const sendDate = addDays(i.nextInspection, -daysBefore);
      const status = sendDate <= today ? 'sendt' : 'planlagt';
      entries.push({
        customer:i.customerName, to:i.email||'(ingen fast mail registreret)',
        subject:`Påmindelse: Reoleftersyn ${daysBefore===7?'inden 7 dage':'inden '+daysBefore+' dage'} — ${i.customerName}`,
        sendDate, status, daysBefore,
        body:`Kære ${i.contact||'kontaktperson'},\n\nDette er en automatisk påmindelse om kommende reoleftersyn.\n\nSeneste eftersyn: ${fmtDate(i.date)}\nNæste planlagte eftersyn: ${fmtDate(i.nextInspection)} (om ${daysBefore} dage)\n\nKontakt os for at aftale tidspunkt.\n\nMed venlig hilsen\nReoler A/S · ReolScan`
      });
    });
  });
  // one illustrative "fejl" example for demo richness
  entries.push({
    customer:'Bramidan A/S', to:'facility@bramidan.dk',
    subject:'Påmindelse: Reoleftersyn inden 60 dage — Bramidan A/S',
    sendDate:'2025-12-01', status:'fejl', daysBefore:60,
    body:'Til: facility@bramidan.dk\nEmne: Påmindelse om kommende reoleftersyn\n\nLevering mislykkedes — mailserver svarede ikke (timeout). Eftersynet for Bramidan A/S er endnu ikke afsluttet, så næste eftersynsdato er ikke fastlagt — påmindelse afventer afslutning af igangværende eftersyn.'
  });
  return entries.sort((a,b)=>a.sendDate.localeCompare(b.sendDate));
}
function renderReminders(){
  const log = buildMailLog();
  const statusPill = {planlagt:'grey', sendt:'green', fejl:'red'};
  const statusLabel = {planlagt:'Planlagt', sendt:'Sendt', fejl:'Fejl'};
  return `
  <div class="panel">
    <h2>Automatiske påmindelser — mail-log</h2>
    <p style="font-size:13px;color:var(--grey-mid)">Ved afslutning af et eftersyn beregnes næste eftersyn automatisk (seneste eftersyn + 12 måneder). Der sendes herefter automatisk en mail til virksomhedens <strong>faste eftersynsmail</strong> (fx drift@, lager@, sikkerhed@, facility@) 60 og 30 dage før næste eftersyn — aldrig til en enkelt persons private mail.</p>
  </div>
  <div class="panel">
    ${log.map(m=>`
      <div class="mail-card">
        <div class="mhead">
          <div>
            <h4>${esc(m.subject)}</h4>
            <div class="mmeta">Til: <span class="mono">${esc(m.to)}</span> · ${esc(m.customer)} · Planlagt udsendelse: ${fmtDate(m.sendDate)}</div>
          </div>
          <span class="pill ${statusPill[m.status]}">${statusLabel[m.status]}</span>
        </div>
        <div class="mail-preview">${esc(m.body)}</div>
      </div>
    `).join('')}
  </div>`;
}

function backupCounts(d){
  const insp=(d.inspections||[]);
  return {kunder:(d.customers||[]).length, eftersyn:insp.length, reoler:insp.reduce((n,x)=>n+((x.reoler||[]).length),0), skader:insp.reduce((n,x)=>n+((x.skader||[]).length),0)};
}
function adminImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const input = e.target;
  const reader = new FileReader();
  reader.onerror = ()=>{ toast('Filen kunne ikke læses'); input.value=''; };
  reader.onload = ev=>{
    let imported;
    try{ imported = JSON.parse(ev.target.result); }
    catch(err){ toast('Kunne ikke læse filen — ugyldig JSON. Eksisterende data er uændret.'); input.value=''; return; }
    if(!imported || !Array.isArray(imported.customers) || !Array.isArray(imported.inspections)){
      toast('Filen er ikke en gyldig ReolScan-backup. Eksisterende data er uændret.'); input.value=''; return;
    }
    const cur = backupCounts(DB), inc = backupCounts(imported);
    const meta = imported._backup ? ('\nBackup oprettet: '+(imported._backup.exportedAt||'ukendt')+' (ReolScan '+(imported._backup.version||'?')+')') : '\n(Ældre backup uden metadata)';
    const msg = '⚠️ GENDAN BACKUP\n\nDette ERSTATTER alle data på denne enhed.\n\n'
      + 'Nu på enheden: '+cur.kunder+' kunder, '+cur.eftersyn+' eftersyn, '+cur.reoler+' reoler, '+cur.skader+' skader\n'
      + 'I backup-filen: '+inc.kunder+' kunder, '+inc.eftersyn+' eftersyn, '+inc.reoler+' reoler, '+inc.skader+' skader'
      + meta + '\n\nEn sikkerhedskopi af nuværende data hentes automatisk først.\n\nFortsæt?';
    if(!confirm(msg)){ toast('Import annulleret — ingen data ændret'); input.value=''; return; }
    const previous = DB;
    adminBackupExport('foer-import');
    try{
      delete imported._backup;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
    }catch(err){
      DB = previous; saveDB(DB);
      showDataBanner('⚠️ Import mislykkedes: backup-filen er for stor til enhedens lager. Eksisterende data er bevaret.');
      input.value=''; return;
    }
    const loaded = loadDB();
    if(_dbCorrupt){ _dbCorrupt=false; DB = previous; saveDB(DB); toast('Backup-filen kunne ikke anvendes — eksisterende data er bevaret'); input.value=''; return; }
    DB = loaded;
    state.currentInspectionId = null; state.view='admin';
    toast('Backup gendannet: '+inc.eftersyn+' eftersyn, '+inc.kunder+' kunder');
    input.value='';
    render();
  };
  reader.readAsText(file);
}
function adminBackupExport(tag){
  try{
    const out = Object.assign({}, DB, {_backup:{app:'ReolScan', version:'RC5.5', exportedAt:new Date().toISOString(), counts:backupCounts(DB)}});
    const dataStr = JSON.stringify(out, null, 2);
    const blob = new Blob([dataStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'reolscan-backup-'+(typeof tag==='string'?tag+'-':'')+todayISO()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Backup eksporteret ('+(dataStr.length/1048576).toFixed(1)+' MB)');
    return true;
  }catch(err){
    showDataBanner('⚠️ Backup kunne ikke oprettes: '+(err&&err.message?err.message:err));
    return false;
  }
}

/* =========================================================
   AI MØNSTERANALYSE
========================================================= */
function aiAnalyzeInspection(insp){
  const sameCustomerInsps = DB.inspections.filter(i=>i.customerId===insp.customerId);
  const allSkader = sameCustomerInsps.flatMap(i=>i.skader.map(s=>({...s, _date:i.date, _inspId:i.id})));

  // gentagne fejltyper (denne kunde, alle år)
  const defectCounts={};
  allSkader.forEach(s=>defectCounts[s.defectType]=(defectCounts[s.defectType]||0)+1);
  const repeatedDefects = Object.entries(defectCounts).filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]);

  // gentagne skader på samme reol
  const reolCounts={};
  allSkader.forEach(s=>reolCounts[s.reolId]=(reolCounts[s.reolId]||0)+1);
  const repeatedReoler = Object.entries(reolCounts).filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]);

  // risikoområder: reoler med kritiske/åbne skader på tværs af år
  const riskReoler = Object.entries(reolCounts).filter(([id,c])=>{
    const sk = allSkader.filter(s=>s.reolId===id);
    return c>1 && sk.some(s=>s.classification==='red');
  });

  // fejl pr. hal
  const reolHal={};
  sameCustomerInsps.forEach(i=>i.reoler.forEach(r=>{ if(!reolHal[r.id]) reolHal[r.id]=r.hal||r.zone||'Ukendt'; }));
  const halCounts={};
  allSkader.forEach(s=>{ const h=reolHal[s.reolId]||'Ukendt'; halCounts[h]=(halCounts[h]||0)+1; });
  const topHal = Object.entries(halCounts).sort((a,b)=>b[1]-a[1]);

  // fejl pr. reolrække
  const reolRaekke={};
  sameCustomerInsps.forEach(i=>i.reoler.forEach(r=>{ if(!reolRaekke[r.id]) reolRaekke[r.id]=r.reolraekke||'Ukendt'; }));
  const raekkeCounts={};
  allSkader.forEach(s=>{ const rk=reolRaekke[s.reolId]||'Ukendt'; raekkeCounts[rk]=(raekkeCounts[rk]||0)+1; });
  const topRaekke = Object.entries(raekkeCounts).sort((a,b)=>b[1]-a[1]);

  // udvikling år for år
  const byYear={};
  sameCustomerInsps.filter(i=>i.status==='closed').forEach(i=>{ byYear[i.date.slice(0,4)]=(byYear[i.date.slice(0,4)]||0)+i.skader.length; });
  const years = Object.entries(byYear).sort((a,b)=>a[0].localeCompare(b[0]));
  let trend = null;
  if(years.length>=2){
    const [,first]=years[0], [,last]=years[years.length-1];
    if(first>0) trend = Math.round((last-first)/first*100);
  }

  return {repeatedDefects, repeatedReoler, riskReoler, topHal, topRaekke, years, trend};
}

function aiManagementSummary(insp){
  const a = aiAnalyzeInspection(insp);
  const counts={green:0,yellow:0,red:0}; insp.skader.forEach(s=>counts[s.classification]++);
  const parts=[];
  parts.push(`Eftersynet identificerede ${insp.skader.length} afvigelse(r) på tværs af ${insp.reoler.length} reoler, heraf ${counts.red} kritisk(e), ${counts.yellow} med behov for udbedring og ${counts.green} uden akut handling.`);
  if(a.repeatedDefects.length){
    parts.push(`Gentagne fejltyper hos kunden: ${a.repeatedDefects.slice(0,3).map(([d,c])=>`${d} (${c}×)`).join(', ')}.`);
  }
  if(a.riskReoler.length){
    parts.push(`Følgende reoler udgør et risikoområde med tilbagevendende kritiske skader: ${a.riskReoler.slice(0,3).map(([id])=>id).join(', ')}.`);
  } else if(a.repeatedReoler.length){
    parts.push(`Gentagne skader er registreret på reol(er): ${a.repeatedReoler.slice(0,3).map(([id,c])=>`${id} (${c}×)`).join(', ')}.`);
  }
  if(a.topHal.length){
    parts.push(`Flest afvigelser er fundet i ${a.topHal[0][0]} (${a.topHal[0][1]} af i alt registrerede afvigelser hos kunden).`);
  }
  if(a.trend!==null){
    parts.push(`Udviklingen i antal fejl fra ${a.years[0][0]} til ${a.years[a.years.length-1][0]} er ${a.trend<=0?'et fald på '+Math.abs(a.trend)+'%':'en stigning på '+a.trend+'%'}.`);
  }
  const vurdering = insp.vurdering ? {green:'Eftersynet vurderes samlet godkendt.',yellow:'Eftersynet vurderes godkendt med bemærkninger — opfølgning på gule/røde punkter anbefales.',red:'Eftersynet vurderes ikke godkendt — kritiske afvigelser skal udbedres før næste eftersyn.'}[insp.vurdering] : '';
  if(vurdering) parts.push(vurdering);
  return parts.join(' ');
}

function generatePDFSync(inspId, opts){
  try{
  const insp = getInspection(inspId);
  if(!insp){ toast('Eftersyn ikke fundet'); return; }
  const { jsPDF } = window.jspdf;
  if(!jsPDF){ toast('PDF-bibliotek ikke indlæst — kontrollér internetforbindelsen'); return; }
  const doc = new jsPDF({unit:'mm',format:'a4'});
  const W = 210, M = 15;
  const navy = BRAND.navy;
  const colors = {green:[46,158,91], yellow:[242,183,5], red:[214,51,74]};

  function header(title){
    doc.setFillColor(...navy);
    doc.rect(0,0,W,22,'F');
    doc.setFillColor(...BRAND.accent);
    doc.rect(0,22,W,1.2,'F');
    let tx = M;
    try{
      const lh = 10;
      const useFile = !!BRAND.pdfLogo;
      const lw = lh*(useFile ? BRAND.pdfLogoRatio : BRAND_FALLBACK.ratio);
      doc.addImage(useFile ? BRAND.pdfLogo : BRAND_FALLBACK.logoPdf,'PNG',M,6,lw,lh);
      tx = M + lw + 7;
    }catch(e){}
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(14);
    doc.text('ReolScan · Reoleftersyn', tx, 14);
    doc.setFontSize(9);
    doc.setFont('helvetica','normal');
    doc.text(insp.reportNumber || '', W-M, 14, {align:'right'});
    doc.setTextColor(0,0,0);
  }
  function footer(){
    // store page number placeholder; overwritten with totals after all pages rendered
    const p = doc.internal.getNumberOfPages();
    doc.setFontSize(8);
    doc.setTextColor(140,150,160);
    doc.text('Reoler A/S · ReolScan', M, 290);
    doc.text('Side '+p, W-M, 290, {align:'right'});
    doc.setTextColor(0,0,0);
  }
  function finalizePageNumbers(){
    const total = doc.internal.getNumberOfPages();
    for(let i=1;i<=total;i++){
      doc.setPage(i);
      doc.setFontSize(8); doc.setTextColor(140,150,160);
      // overwrite the right-aligned page number with X/Y
      doc.setFillColor(255,255,255); doc.rect(W-60,284,60,10,'F');
      doc.text('Side '+i+' af '+total, W-M, 290, {align:'right'});
      doc.setTextColor(0,0,0);
    }
  }

  // --- Forside ---
  header('');
  // Afsender (logoet står i sidehovedet)
  doc.setTextColor(100,120,140); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text('Reoler A/S · ReolScan · Professionelle reoleftersyn', M, 38);

  // QR code
  try{
    const qr = qrDataUrl(reportUrl(insp), 120);
    if(qr) doc.addImage(qr, 'PNG', W-M-26, 28, 26, 26);
    doc.setFontSize(6); doc.setTextColor(140,150,160);
    doc.text('QR åbner kun rapporten i ReolScan', W-M, 57, {align:'right'});
    doc.text('på den enhed, hvor den er gemt', W-M, 59.6, {align:'right'});
    doc.setTextColor(0,0,0);
  }catch(e){}

  // Title + customer
  doc.setFont('helvetica','bold'); doc.setFontSize(26);
  doc.setTextColor(...navy);
  doc.text('Reoleftersyn', M, 68);
  doc.setFontSize(18); doc.setTextColor(...navy);
  doc.text(insp.customerName, M, 80);

  // Divider
  doc.setDrawColor(...navy); doc.setLineWidth(0.8);
  doc.line(M, 85, W-M, 85);

  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(0,0,0);
  let y = 95;
  const rows = [
    ['Adresse', insp.address||'—'],
    ['CVR', insp.cvr||'—'],
    ['Kontaktperson', insp.contact||'—'],
    ['Mail', insp.email||'—'],
    ['Dato for eftersyn', fmtDate(insp.date)],
    ['Inspektør', insp.inspector||'—'],
    ['Rapportnummer', insp.reportNumber||'—'],
    ['Næste eftersyn', fmtDate(insp.nextInspection)]
  ];
  rows.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.setTextColor(80,90,110); doc.text(k+':', M, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(0,0,0); doc.text(String(v), M+46, y);
    y+=8;
  });

  // Konklusion
  const counts={green:0,yellow:0,red:0};
  insp.skader.forEach(s=>counts[s.classification]++);
  y+=6;
  doc.setDrawColor(220,225,230); doc.setLineWidth(0.4);
  doc.line(M, y, W-M, y); y+=8;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...navy);
  doc.text('Konklusion', M, y); y+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(0,0,0);
  let conclusion = `Eftersynet omfatter ${insp.reoler.length} reoler og ${insp.skader.length} registrerede observationer. `+
    `${counts.red} kritisk(e) skade(r) kræver øjeblikkelig handling, ${counts.yellow} skade(r) skal udbedres, og ${counts.green} observation(er) er uden akut handling. `+
    `Næste eftersyn anbefales senest ${fmtDate(insp.nextInspection)}.`;
  { const c0=ctrlSummary(insp); if(c0.unc) conclusion += ' '+c0.unc+' af '+c0.total+' kontrolpunkter er ikke kontrolleret.'; }
  const lines = doc.splitTextToSize(conclusion, W-2*M);
  doc.text(lines, M, y);
  y += lines.length*6 + 10;

  // Klassifikation badges
  const badge=(label,col,xx)=>{
    doc.setFillColor(...col); doc.roundedRect(xx,y,42,13,2,2,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(label, xx+21, y+8.5, {align:'center'});
    doc.setTextColor(0,0,0); doc.setFont('helvetica','normal');
  };
  badge('GRØN: '+counts.green, colors.green, M);
  badge('GUL: '+counts.yellow, colors.yellow, M+47);
  badge('RØD: '+counts.red, colors.red, M+94);
  if(insp.vurdering){
    y+=20;
    const vMap={green:['GODKENDT',colors.green], yellow:['GODKENDT MED BEMÆRKNINGER',colors.yellow], red:['IKKE GODKENDT',colors.red]};
    const vm=vMap[insp.vurdering];
    doc.setFillColor(...vm[1]); doc.roundedRect(M, y, 120, 13, 2, 2, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Samlet vurdering: '+vm[0], M+60, y+8.5, {align:'center'});
    doc.setTextColor(0,0,0); doc.setFont('helvetica','normal');
  }
  footer();

  // --- AI Ledelsesresumé + Tjekliste (afvigelser) ---
  doc.addPage(); header();
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...navy);
  doc.text('AI Ledelsesresumé', M, 32); doc.setTextColor(0,0,0);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  let sy=42;
  const summaryLines = doc.splitTextToSize(aiManagementSummary(insp), W-2*M);
  doc.text(summaryLines, M, sy); sy += summaryLines.length*6 + 10;

  { // RC5.5: komplet kontrolliste med fire tydeligt adskilte statusser
    const cs = ctrlSummary(insp), pts = ctrlPoints(insp), cl = insp.checklist||{};
    const need = n=>{ if(sy+n>278){ doc.addPage(); header(); sy=32; } };
    need(40);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Kontrolliste ('+cs.total+' kontrolpunkter)', M, sy); sy+=7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const sl = doc.splitTextToSize('Kontrolleret og OK: '+cs.ok+'  ·  Registreret afvigelse: '+cs.fejl+'  ·  Ikke relevant: '+cs.ikr+'  ·  Ikke kontrolleret: '+cs.unc, W-2*M);
    doc.text(sl, M, sy); sy += sl.length*5+3;
    const COL = {ok:[31,122,68], fejl:[168,35,58], ikr:[110,120,130], unc:[154,108,0]};
    const TXT = {ok:'Kontrolleret og OK', fejl:'Registreret afvigelse', ikr:'Ikke relevant', unc:'IKKE KONTROLLERET'};
    pts.forEach(h=>{
      need(7); const v = cl[h.key]==='ok'||cl[h.key]==='fejl'||cl[h.key]==='ikr' ? cl[h.key] : 'unc';
      doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.text(h.label, M, sy);
      doc.setTextColor(...COL[v]); doc.setFont('helvetica','bold'); doc.text(TXT[v], M+110, sy);
      sy += 6;
    });
    doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); sy += 2;
    if(cs.unc>0){
      need(14); doc.setFont('helvetica','bold'); doc.setTextColor(...COL.unc);
      const nl = doc.splitTextToSize('Bemærk: '+cs.unc+' af '+cs.total+' kontrolpunkter er ikke kontrolleret og er derfor ikke vurderet i dette eftersyn.', W-2*M);
      doc.text(nl, M, sy); sy += nl.length*5+4; doc.setTextColor(0,0,0); doc.setFont('helvetica','normal');
    }
    const ms = insp.measurements||[];
    if(ms.length){
      need(20); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Målinger ('+ms.length+')', M, sy); sy+=7;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      ms.forEach(x=>{
        const t = '• '+fhLabel(x.ctrlKey)+': '+x.valueMm+' mm'+(x.reolId?' · reol '+x.reolId:'')+(x.direction?' · '+x.direction:'')+(x.limitMm!=null?' · vejledende grænse '+x.limitMm+' mm (brochure s. '+x.limitPage+')':'')+(x.comment?' · '+x.comment:'');
        const ml = doc.splitTextToSize(t, W-2*M); need(ml.length*5+2); doc.text(ml, M, sy); sy += ml.length*5+1;
      });
      need(12); const nn = doc.splitTextToSize('Målinger er registreret af inspektøren og er ikke i sig selv en godkendelse.', W-2*M);
      doc.setTextColor(110,120,130); doc.text(nn, M, sy); sy += nn.length*5+4; doc.setTextColor(0,0,0);
    }
  }

  // AI mønsteranalyse
  const ai = aiAnalyzeInspection(insp);
  sy+=4;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('AI Mønsteranalyse', M, sy); sy+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const aiLines = [];
  if(ai.repeatedDefects.length) aiLines.push('Gentagne fejl: '+ai.repeatedDefects.slice(0,5).map(([d,c])=>`${d} (${c}×)`).join(', '));
  else aiLines.push('Gentagne fejl: ingen fundet.');
  if(ai.repeatedReoler.length) aiLines.push('Gentagne skader på samme reol: '+ai.repeatedReoler.slice(0,5).map(([id,c])=>`${id} (${c}×)`).join(', '));
  else aiLines.push('Gentagne skader på samme reol: ingen fundet.');
  if(ai.riskReoler.length) aiLines.push('Risikoområder (reoler med tilbagevendende kritiske skader): '+ai.riskReoler.map(([id])=>id).join(', '));
  else aiLines.push('Risikoområder: ingen identificeret.');
  if(ai.topHal.length) aiLines.push('Fejl pr. hal: '+ai.topHal.map(([h,c])=>`${h} (${c})`).join(', '));
  if(ai.topRaekke.length) aiLines.push('Fejl pr. reolrække: '+ai.topRaekke.map(([r,c])=>`${r} (${c})`).join(', '));
  if(ai.years.length) aiLines.push('Udvikling år for år: '+ai.years.map(([y,c])=>`${y}: ${c}`).join(' · ')+(ai.trend!==null?` (${ai.trend<=0?'↓ ':'↑ +'}${ai.trend}%)`:''));
  aiLines.forEach(line=>{
    const wrapped = doc.splitTextToSize('• '+line, W-2*M);
    doc.text(wrapped, M, sy); sy += wrapped.length*6;
  });
  footer();

  // --- Reoloversigt ---
  doc.addPage(); header();
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...navy);
  doc.text('Reoloversigt', M, 32); doc.setTextColor(0,0,0);
  y=42;
  doc.setFontSize(9); doc.setFont('helvetica','bold');
  const cols=['Reol-ID','Zone','Lokation','Type','Producent','Skilt','Bemærk.'];
  const colW=[18,12,42,28,28,16,30];
  let x=M;
  cols.forEach((c,i)=>{ doc.text(c,x,y); x+=colW[i]; });
  y+=2; doc.setDrawColor(...navy); doc.line(M,y,W-M,y); y+=6;
  doc.setFont('helvetica','normal');
  insp.reoler.forEach(r=>{
    if(y>270){ footer(); doc.addPage(); header(); y=32; }
    x=M;
    const vals=[r.id,r.zone,r.location,r.type,r.producer, r.loadSign==='ja'?'Ja':'Nej', r.notes||'—'];
    vals.forEach((v,i)=>{
      const t = doc.splitTextToSize(String(v), colW[i]-2);
      doc.text(t[0]||'', x, y);
      x+=colW[i];
    });
    y+=7;
  });
  footer();

  // --- Skader (grupperet pr. registrering — flere afkrydsede typer vises samlet) ---
  const skadeGroups = (()=>{
    const seen = new Set(); const groups = [];
    insp.skader.forEach(s=>{
      const gid = s.groupId || s.id;
      if(seen.has(gid)) return;
      seen.add(gid);
      groups.push(insp.skader.filter(x=>(x.groupId||x.id)===gid));
    });
    return groups;
  })();

  skadeGroups.forEach((group,idx)=>{
    const s = group[0]; // fælles felter: reol, lokation, prioritet, foto, kommentar, tale
    doc.addPage(); header();
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...navy);
    doc.text('Skade '+(idx+1)+' af '+skadeGroups.length, M, 32);
    doc.setTextColor(0,0,0);
    const col = colors[s.classification];
    doc.setFillColor(...col);
    doc.roundedRect(M, 38, 30, 9, 2, 2, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    const labels={green:'GRØN',yellow:'GUL',red:'RØD'};
    doc.text(labels[s.classification], M+15, 44.5, {align:'center'});
    doc.setTextColor(0,0,0);

    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    y=55;
    const anbefaling = {
      red:'Kritisk skade — udbedres straks. Reolen bør aflastes/spærres til reparation er udført.',
      yellow:'Skal udbedres ved næste planlagte vedligehold. Følg op på deadline.',
      green:'Ingen akut handling. Hold under observation ved næste eftersyn.'
    }[s.classification];
    const prioritet = {red:'Høj',yellow:'Middel',green:'Lav'}[s.classification];
    const fejltyper = group.map(g=>g.defectType).join(', ');
    const handling = `${s.status}${s.kommentar?' · '+s.kommentar:''}${s.ansvarlig?' · Ansvarlig: '+s.ansvarlig:''}${s.deadline?' · Deadline: '+fmtDate(s.deadline):''}${s.udfortDato?' · Udført: '+fmtDate(s.udfortDato):''}`;
    [['Reol-ID',s.reolId],['Lokation',s.location||'—'],['Fejltyper',fejltyper],['Prioritet',prioritet]].forEach(([k,v])=>{
      doc.setFont('helvetica','bold'); doc.text(k+':', M, y);
      doc.setFont('helvetica','normal');
      const vl = doc.splitTextToSize(String(v), W-2*M-32);
      doc.text(vl, M+32, y);
      y+=6*vl.length+1;
    });
    y+=2;
    if(s.desc){
      doc.setFont('helvetica','bold'); doc.text('Beskrivelse:', M, y); y+=6;
      doc.setFont('helvetica','normal');
      const dl = doc.splitTextToSize(s.desc, W-2*M);
      doc.text(dl, M, y); y += dl.length*6 + 4;
    }
    doc.setFont('helvetica','bold'); doc.text('Anbefaling:', M, y); y+=6;
    doc.setFont('helvetica','normal');
    const al = doc.splitTextToSize(anbefaling, W-2*M);
    doc.text(al, M, y); y += al.length*6 + 4;
    doc.setFont('helvetica','bold'); doc.text('Handling:', M, y); y+=6;
    doc.setFont('helvetica','normal');
    const hl = doc.splitTextToSize(handling, W-2*M);
    doc.text(hl, M, y); y += hl.length*6 + 4;

    if(s.voiceNote && s.voiceNote.text){
      doc.setFont('helvetica','bold'); doc.text('Kommentar (inspektør):', M, y); y+=6;
      doc.setFont('helvetica','normal');
      const vnl = doc.splitTextToSize(s.voiceNote.text+'  ('+fmtDate(s.voiceNote.date)+' '+(s.voiceNote.time||'')+', '+s.voiceNote.inspector+')', W-2*M);
      doc.text(vnl, M, y); y += vnl.length*6 + 4;
    }

    { // RC5.5: ALLE fotos, ét pr. række med reol, placering, beskrivelse, risiko, handling, dato og billedtekst
      const caps = s.photoCaptions||[];
      const list = [];
      (s.photos||[]).forEach((p,i)=>{ if(p && !/^data:image\/svg/.test(p)) list.push({p, cap:caps[i]||'', after:false}); });
      (s.photosAfter||[]).forEach(p=>{ if(p && !/^data:image\/svg/.test(p)) list.push({p, cap:'', after:true}); });
      const boxW=72, boxH=54, tx=M+boxW+6, tw=W-M-tx;
      const hdr = ()=>{ doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...navy); doc.text('Fotodokumentation — skade '+(idx+1)+' (reol '+s.reolId+')', M, y); doc.setTextColor(0,0,0); y+=7; };
      if(list.length){
        if(y+boxH+16>272){ footer(); doc.addPage(); header(); y=32; }
        hdr();
        list.forEach((x,i)=>{
          if(y+boxH+4>274){ footer(); doc.addPage(); header(); y=32; hdr(); }
          const im = (typeof PDFIMG!=='undefined' && PDFIMG.get(x.p)) || null;
          let drawn=false, iw=boxW, ih=boxH;
          if(im && !im.fail){
            const k=Math.min(boxW/im.w, boxH/im.h); iw=im.w*k; ih=im.h*k;
            try{ doc.addImage(im.data,'JPEG',M,y,iw,ih); drawn=true; }catch(e){}
          }
          if(!drawn){
            doc.setDrawColor(200,60,60); doc.rect(M,y,boxW,boxH); doc.setFontSize(8); doc.setTextColor(200,60,60);
            doc.text(doc.splitTextToSize('FOTO KUNNE IKKE INDLÆSES I RAPPORTEN',boxW-6), M+3, y+8); doc.setTextColor(0,0,0); doc.setDrawColor(0,0,0);
          }
          const lines = [
            ['Foto '+(i+1)+' af '+list.length+(x.after?' — efter reparation':''), true],
            ['Reol: '+s.reolId+(s.location?' · '+s.location:''), false],
            ['Skade: '+fejltyper+(s.desc?' — '+s.desc:''), false],
            ['Risiko: '+prioritet+' ('+labels[s.classification]+')', false],
            ['Handling: '+(s.kommentar||'ikke angivet'), false],
            ['Dato: '+fmtDate(s.date), false]
          ];
          if(x.cap) lines.push(['Billedtekst: '+x.cap, 'i']);
          doc.setFontSize(9); let ty=y+4;
          lines.forEach(([t,b])=>{
            doc.setFont('helvetica', b===true?'bold':(b==='i'?'italic':'normal'));
            const wl=doc.splitTextToSize(t, tw); doc.text(wl, tx, ty); ty+=wl.length*4.2+1;
          });
          doc.setFont('helvetica','normal'); doc.setFontSize(11);
          y += Math.max(ih, boxH, ty-y) + 5;
        });
      }
    }
    footer();
  });

  // --- Underskrifter & konklusion ---
  doc.addPage(); header();
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...navy);
  doc.text('Underskrifter & konklusion', M, 32); doc.setTextColor(0,0,0);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Inspektør: '+insp.inspector, M, 45);
  if(insp.signatures.inspector){ try{doc.addImage(insp.signatures.inspector,'PNG',M,50,80,30);}catch(e){} }
  doc.line(M,82,M+80,82);
  doc.text('Kunde: '+(insp.contact||''), M, 100);
  if(insp.signatures.customer){ try{doc.addImage(insp.signatures.customer,'PNG',M,105,80,30);}catch(e){} }
  doc.line(M,137,M+80,137);

  let fy=150;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Konklusion', M, fy); fy+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const fl = doc.splitTextToSize(conclusion, W-2*M);
  doc.text(fl, M, fy); fy += fl.length*6 + 6;
  const overall = insp.vurdering ? (VURDERING_META[insp.vurdering].label+' (vurderet af inspektøren)') : 'Ikke angivet af inspektøren';
  doc.setFont('helvetica','bold'); doc.text('Samlet vurdering:', M, fy);
  doc.setFont('helvetica','normal'); doc.text(overall, M+45, fy); fy+=10;
  doc.setFont('helvetica','bold'); doc.text('Anbefalet næste eftersyn:', M, fy);
  doc.setFont('helvetica','normal'); doc.text(fmtDate(insp.nextInspection), M+62, fy);
  footer();

  finalizePageNumbers();
  const _fn=(insp.reportNumber||'eftersyn')+'_'+insp.customerName.replace(/[^a-z0-9]+/gi,'_')+'.pdf';
  if(opts && opts.asBlob){ return {blob:doc.output('blob'), filename:_fn, pages:doc.getNumberOfPages()}; }

/* ---------- PDF-adgang: lokal fil → ellers indlejret kopi (file://) ---------- */
const FH = { bytes:null, pdf:null, loading:null, zoom:1, scrollY:0, opener:null };
function fhLoadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Kunne ikke indlæse '+src)); document.head.appendChild(s);
  });
}
async function fhGetBytes(){
  if(FH.bytes) return FH.bytes;
  try{
    const r = await fetch(FAGLIG.pdfUrl);
    if(!r.ok) throw new Error('HTTP '+r.status);
    FH.bytes = new Uint8Array(await r.arrayBuffer());
  }catch(e){
    if(!window.BROCHURE_B64) await fhLoadScript(FAGLIG.dataUrl);
    const bin = atob(window.BROCHURE_B64); const u = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    FH.bytes = u;
  }
  return FH.bytes;
}
async function fhGetPdf(){
  if(FH.pdf) return FH.pdf;
  if(FH.loading) return FH.loading;
  FH.loading = (async()=>{
    if(!window.pdfjsLib) await fhLoadScript(FAGLIG.pdfjsUrl);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = FAGLIG.workerUrl;
    const bytes = await fhGetBytes();
    FH.pdf = await window.pdfjsLib.getDocument({data: bytes.slice()}).promise;
    return FH.pdf;
  })();
  try{ return await FH.loading; } finally { FH.loading = null; }
}

function closeBrochure(fromPop){
  const v=document.getElementById('fhViewer');

  if(v){ try{ if(Math.abs(window.scrollY-FH.scrollY)>1) window.scrollTo(0,FH.scrollY); if(FH.opener&&FH.opener.isConnected) FH.opener.focus({preventScroll:true}); }catch(e){} }

let fhRT=null;
function fhResizeDebounced(){ clearTimeout(fhRT); fhRT=setTimeout(()=>{ if(document.getElementById('fhViewer')) fhBuild(fhCurPage()); },250); }
async function fhBuild(startPage){
  const body = document.getElementById('fhBody'); if(!body) return;
  try{
    const pdf = await fhGetPdf();
    if(!document.getElementById('fhBody')) return;
    body.innerHTML='';
    const avail = Math.max(240, body.clientWidth-16);
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const wraps=[];
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const vp0 = page.getViewport({scale:1});
      const cssScale = (avail/vp0.width)*FH.zoom;
      const vp = page.getViewport({scale:cssScale*dpr});
      const w = document.createElement('div'); w.className='fh-page'; w.dataset.page=i;
      const c = document.createElement('canvas');
      c.width=vp.width; c.height=vp.height; c.style.width=(vp.width/dpr)+'px'; c.style.height=(vp.height/dpr)+'px';
      c.setAttribute('aria-label','Side '+i);
      w.appendChild(c); body.appendChild(w); wraps.push([page,c,vp]);
    }
    fhScrollTo(startPage, true);
    body.onscroll = fhUpdateInd;
    const order = wraps.map((x,i)=>i).sort((a,b)=>Math.abs(a-(startPage-1))-Math.abs(b-(startPage-1)));
    for(const idx of order){
      if(!document.getElementById('fhBody')) return;
      const [page,c,vp]=wraps[idx];
      await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    }
    fhUpdateInd();
  }catch(e){
    const m = document.getElementById('fhBody');
    if(m) m.innerHTML = '<div class="fh-msg">Brochuren kunne ikke vises her ('+esc(e.message||e)+').<br>Dine registreringer er urørte. Tryk "← Tilbage" for at fortsætte, eller "Download PDF" for at åbne brochuren i din PDF-læser.</div>';
  }
}

  const body=document.getElementById('fhBody'); if(!body) return 1;

  body.querySelectorAll('.fh-page').forEach(p=>{ if(p.offsetTop<=mid) cur=parseInt(p.dataset.page,10); });
  return cur;
}

  body.scrollTo({top: el.offsetTop-6, behavior: instant?'auto':'smooth'});

function fhStep(d){ fhScrollTo(Math.max(1,Math.min(FAGLIG.pages, fhCurPage()+d))); }
function fhZoom(d){ FH.zoom = Math.max(0.5, Math.min(3, FH.zoom+d)); fhBuild(fhCurPage()); }
async function downloadBrochure(){
  try{
    const bytes = await fhGetBytes();
    const blob = new Blob([bytes], {type:'application/pdf'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = FAGLIG.fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){ toast('Download mislykkedes'); }
}

/* ---------- Målinger ---------- */
function fhReadPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const max=1000, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7)); }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function fhCloseMeasure(){ const o=document.getElementById('fhMeasureOverlay'); if(o) o.remove(); }
function fhMeasure(key){

    <button class="modal-close" onclick="fhCloseMeasure()" aria-label="Luk">✕</button>
    <h2>📏 ${esc(m.title)}</h2>
    <p class="fh-disc" style="margin:0 0 8px"><b>Målemetode:</b> ${esc(m.method)} <a href="#" onclick="event.preventDefault();openBrochure(${m.pages[0]})">Se illustration, side ${m.pages[0]}</a></p>

      <div class="field"><label>Reol</label><select id="fm_reol"><option value="">—</option>${insp.reoler.map(r=>`<option value="${esc(r.id)}">${esc(r.id)}</option>`).join('')}</select></div>

      ${m.needLen?`<div class="field full"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="fm_len" onchange="fhMeasureInfo()" style="width:22px;height:22px"> Målt over ${m.needLen} mm</label></div>`:''}
      <div class="field"><label>Målt værdi (mm)</label><input id="fm_val" type="number" inputmode="decimal" step="0.1" min="0" oninput="fhMeasureInfo()"></div>
      <div class="field"><label>Måleretning</label><select id="fm_dir"><option value="">—</option>${FAGLIG.dirs.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div>
      <div class="field full"><label>Foto</label><input id="fm_photo" type="file" accept="image/*" capture="environment"></div>
      <div class="field full"><label>Kommentar</label><textarea id="fm_note" rows="2"></textarea></div>
    </div>
